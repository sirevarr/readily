<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Readily</title>
  <meta name="description" content="Tu lector personal de PDFs con subrayados, notas y chat con IA. Sincronizado en la nube.">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#201E1B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Readily">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    :root {
      --paper: #F3EFE6; --ink: #262421; --ink-soft: #5B564E;
      --spine: #201E1B; --spine-text: #F3EFE6;
      --accent: #3F6E63; --accent-hover: #34594f; --accent-soft: #DCE7E3;
      --line: #DDD5C4; --sidebar-bg: #FBF9F4;
      --serif: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --radius: 10px;
      --shadow: 0 8px 28px rgba(38,36,33,0.10);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: var(--sans); color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; }
    #app-root { min-height: 100vh; display: flex; flex-direction: column; }

    /* ---- Loading ---- */
    .loading-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
    .spinner { width: 38px; height: 38px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.75s linear infinite; }
    .loading-label { font-size: 14px; color: var(--ink-soft); letter-spacing: 0.01em; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Centered card screens ---- */
    .screen { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card {
      background: #fff; border: 1px solid var(--line); border-radius: 16px;
      padding: 36px 32px; width: 100%; max-width: 420px; box-shadow: var(--shadow);
    }
    .card-logo {
      font-family: var(--serif); font-style: italic; font-weight: 400;
      font-size: 30px; color: var(--accent); margin-bottom: 2px;
    }
    .card-tagline { color: var(--ink-soft); font-size: 13px; margin-bottom: 28px; }
    .card h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
    .card-hint { color: var(--ink-soft); font-size: 13px; line-height: 1.55; margin-bottom: 22px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 500; color: var(--ink-soft); margin-bottom: 5px; }
    .field input {
      width: 100%; padding: 10px 13px; border: 1px solid var(--line); border-radius: var(--radius);
      font-size: 14px; font-family: var(--sans); outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(63,110,99,0.12); }
    .btn-primary {
      width: 100%; background: var(--accent); color: #fff; border: none; padding: 12px;
      border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer;
      margin-top: 6px; transition: background 0.15s, transform 0.08s;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-link { background: none; border: none; color: var(--accent); font-size: 13px; cursor: pointer; padding: 0; text-decoration: underline; margin-top: 16px; display: block; }
    .error-msg { color: #B4433A; font-size: 13px; margin-top: 10px; line-height: 1.4; }
    .ok-msg { color: var(--accent); font-size: 13px; margin-top: 10px; line-height: 1.4; }

    /* ---- Library ---- */
    .library-wrap { flex: 1; padding: 44px 20px 60px; max-width: 760px; margin: 0 auto; width: 100%; }
    .library-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 32px; }
    .library-title { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 30px; line-height: 1.2; }
    .library-title span { display: block; font-family: var(--sans); font-style: normal; font-size: 13px; color: var(--ink-soft); font-weight: 400; margin-top: 3px; }
    .library-actions { display: flex; gap: 12px; align-items: center; margin-top: 6px; }
    .upload-btn {
      background: var(--accent); color: #fff; border: none; padding: 10px 20px;
      border-radius: 999px; font-size: 13px; font-weight: 500; cursor: pointer;
      transition: background 0.15s; white-space: nowrap;
    }
    .upload-btn:hover { background: var(--accent-hover); }
    .upload-btn input { display: none; }
    .logout-link { background: none; border: none; color: var(--ink-soft); font-size: 12px; cursor: pointer; text-decoration: underline; }
    .upload-progress { font-size: 13px; color: var(--ink-soft); margin-bottom: 14px; padding: 10px 14px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); display: none; }
    .doc-list { display: flex; flex-direction: column; gap: 10px; }
    .doc-item {
      display: flex; justify-content: space-between; align-items: center; background: #fff;
      border: 1px solid var(--line); border-radius: 12px; padding: 17px 20px; cursor: pointer;
      transition: background 0.12s, box-shadow 0.12s, transform 0.1s;
    }
    .doc-item:hover { background: var(--accent-soft); box-shadow: 0 4px 16px rgba(63,110,99,0.1); transform: translateX(2px); }
    .doc-title { font-size: 14px; font-weight: 500; margin-bottom: 3px; }
    .doc-meta { font-size: 12px; color: var(--ink-soft); }
    .doc-arrow { color: var(--ink-soft); font-size: 18px; transition: transform 0.12s; }
    .doc-item:hover .doc-arrow { transform: translateX(4px); color: var(--accent); }
    .empty-lib { color: var(--ink-soft); font-size: 14px; text-align: center; padding: 64px 20px; line-height: 1.8; }

    /* ---- Reader header (sticky) ---- */
    .reader-header { position: sticky; top: 0; z-index: 20; }

    /* ---- Toolbar (spine) ---- */
    .spine {
      background: var(--spine); color: var(--spine-text);
      display: flex; align-items: center; gap: 10px; padding: 9px 16px; flex-wrap: wrap;
    }
    .brand {
      font-family: var(--serif); font-style: italic; font-size: 18px;
      margin-right: 4px; white-space: nowrap; cursor: pointer;
      opacity: 0.85; transition: opacity 0.15s; user-select: none;
    }
    .brand:hover { opacity: 1; }
    .spine-sep { width: 1px; height: 20px; background: rgba(255,255,255,0.12); flex-shrink: 0; }
    .spine-btn {
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
      color: var(--spine-text); padding: 6px 12px; border-radius: 999px; font-size: 13px;
      cursor: pointer; transition: background 0.12s; white-space: nowrap; line-height: 1;
    }
    .spine-btn:hover { background: rgba(255,255,255,0.16); }
    .spine-btn:active { background: rgba(255,255,255,0.22); }
    .spine-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .spine-btn.active { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.38); }
    .pagectl { display: flex; align-items: center; gap: 6px; font-size: 13px; }
    .pagectl input {
      width: 48px; text-align: center; padding: 5px 4px; border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.08);
      color: var(--spine-text); font-size: 13px; outline: none;
    }
    .pagectl input:focus { border-color: rgba(255,255,255,0.45); background: rgba(255,255,255,0.14); }
    .page-total { font-size: 13px; opacity: 0.55; }
    .spacer { flex: 1; }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #7FAE8C; flex-shrink: 0; }
    .sync-dot.saving { background: #E9B949; animation: syncPulse 1.1s ease-in-out infinite; }
    @keyframes syncPulse { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.35; } }

    /* ---- Search bar ---- */
    .search-bar-row {
      background: #181512; padding: 7px 14px;
      display: flex; gap: 8px; align-items: center;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .search-bar-row.hidden { display: none; }
    .search-input {
      flex: 1; background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.18);
      color: var(--spine-text); border-radius: 8px; padding: 7px 12px;
      font-size: 13px; font-family: var(--sans); outline: none; transition: border-color 0.15s;
    }
    .search-input::placeholder { color: rgba(255,255,255,0.38); }
    .search-input:focus { border-color: rgba(255,255,255,0.42); background: rgba(255,255,255,0.13); }
    .search-count { font-size: 12px; color: rgba(255,255,255,0.45); white-space: nowrap; min-width: 70px; text-align: right; }
    .search-nav-btn {
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
      color: var(--spine-text); width: 28px; height: 28px; border-radius: 6px;
      cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center;
      transition: background 0.12s; flex-shrink: 0;
    }
    .search-nav-btn:hover { background: rgba(255,255,255,0.18); }
    .search-nav-btn:disabled { opacity: 0.28; cursor: not-allowed; }

    /* ---- Search results panel ---- */
    .search-results-panel {
      background: #fff; border: 1px solid var(--line); border-top: none;
      max-height: 210px; overflow-y: auto;
      box-shadow: 0 10px 28px rgba(0,0,0,0.13);
    }
    .srp-item {
      padding: 9px 16px; border-bottom: 1px solid var(--line);
      cursor: pointer; font-size: 13px; display: flex; align-items: baseline;
      gap: 10px; transition: background 0.1s;
    }
    .srp-item:hover { background: var(--accent-soft); }
    .srp-item.active { background: #EEF4F2; }
    .srp-item:last-child { border-bottom: none; }
    .srp-page {
      font-size: 11px; color: var(--ink-soft); background: var(--line);
      padding: 2px 6px; border-radius: 4px; flex-shrink: 0; font-weight: 500;
    }
    .srp-snippet { flex: 1; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .srp-snippet em { background: rgba(233,185,73,0.38); font-style: normal; color: var(--ink); padding: 0 1px; border-radius: 2px; }

    /* ---- Workspace ---- */
    .workspace { flex: 1; display: flex; min-height: 0; }
    .stage { flex: 1; overflow: auto; display: flex; justify-content: center; padding: 36px 16px; }
    .page-frame { display: flex; gap: 12px; align-items: flex-start; }
    .page-wrap { position: relative; background: #fff; box-shadow: 0 8px 32px rgba(38,36,33,0.18); }
    .highlight-layer { position: absolute; inset: 0; pointer-events: none; }
    .hl-rect { position: absolute; mix-blend-mode: multiply; border-radius: 2px; pointer-events: auto; cursor: pointer; }
    .textLayer {
      position: absolute; inset: 0; overflow: hidden; line-height: 1; opacity: 1; transform-origin: 0 0;
    }
    .textLayer span, .textLayer br { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
    .textLayer ::selection { background: rgba(63,110,99,0.28); }
    .selection-toolbar {
      position: absolute; display: flex; gap: 6px; align-items: center; background: var(--spine);
      padding: 7px 10px; border-radius: 999px; box-shadow: 0 8px 22px rgba(0,0,0,0.28);
      z-index: 30; transform: translate(-50%, -100%);
    }
    .selection-toolbar .swatch-dot {
      width: 19px; height: 19px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: transform 0.1s, box-shadow 0.1s;
    }
    .selection-toolbar .swatch-dot:hover { transform: scale(1.2); box-shadow: 0 0 0 2px rgba(255,255,255,0.35); }
    .selection-toolbar::after {
      content: ''; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%);
      border-width: 5px 5px 0 5px; border-style: solid;
      border-color: var(--spine) transparent transparent transparent;
    }
    .sel-divider { width: 1px; height: 16px; background: rgba(255,255,255,0.22); }
    .explain-btn {
      background: rgba(255,255,255,0.1); color: var(--spine-text);
      border: 1px solid rgba(255,255,255,0.28); border-radius: 999px;
      padding: 3px 10px; font-size: 12px; cursor: pointer; white-space: nowrap;
      transition: background 0.12s;
    }
    .explain-btn:hover { background: rgba(255,255,255,0.2); }
    .margin-strip { width: 14px; align-self: stretch; position: relative; border-left: 1px dashed var(--line); }
    .tick { position: absolute; left: 3px; width: 8px; height: 3px; border-radius: 2px; cursor: pointer; transition: transform 0.1s; }
    .tick:hover { transform: scaleX(1.5); }

    /* ---- Sidebar ---- */
    .sidebar { width: 290px; background: var(--sidebar-bg); border-left: 1px solid var(--line); overflow: hidden; flex-shrink: 0; display: flex; flex-direction: column; }
    .sidebar.hidden { display: none; }
    .sidebar-tabs { display: flex; border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .sidebar-tabs button {
      flex: 1; background: none; border: none; padding: 12px 6px; font-size: 12px;
      cursor: pointer; color: var(--ink-soft); border-bottom: 2px solid transparent;
      transition: color 0.12s, border-color 0.12s; white-space: nowrap;
    }
    .sidebar-tabs button.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
    .sidebar-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }

    /* Highlights tab */
    .hl-item { padding: 11px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; cursor: pointer; transition: background 0.1s; }
    .hl-item:hover { background: var(--accent-soft); }
    .hl-item.flash { background: var(--accent-soft); }
    .hl-bar { width: 4px; border-radius: 2px; flex-shrink: 0; margin-top: 2px; }
    .hl-body { flex: 1; min-width: 0; }
    .hl-page { font-size: 11px; color: var(--ink-soft); margin-bottom: 3px; }
    .hl-text { font-size: 13px; line-height: 1.45; }
    .hl-note {
      margin-top: 7px; width: 100%; font-size: 12px; font-family: var(--sans);
      padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px;
      resize: vertical; min-height: 34px; outline: none; background: #fff;
      transition: border-color 0.15s;
    }
    .hl-note:focus { border-color: var(--accent); }
    .hl-actions { display: flex; gap: 8px; margin-top: 6px; }
    .hl-actions button { background: none; border: none; color: var(--ink-soft); font-size: 11px; cursor: pointer; padding: 0; text-decoration: underline; transition: color 0.12s; }
    .hl-actions button:hover { color: #B4433A; }
    .empty-sidebar { padding: 22px 18px; font-size: 13px; color: var(--ink-soft); line-height: 1.65; }

    /* TOC tab */
    .toc-entry {
      display: flex; align-items: baseline; gap: 8px;
      padding: 9px 14px; border-bottom: 1px solid var(--line);
      cursor: pointer; font-size: 13px; line-height: 1.4; transition: background 0.1s;
    }
    .toc-entry:hover { background: var(--accent-soft); }
    .toc-title { flex: 1; }
    .toc-page { font-size: 11px; color: var(--ink-soft); flex-shrink: 0; }
    .toc-entry.d0 { font-weight: 600; }
    .toc-entry.d1 { color: var(--ink-soft); font-size: 12px; }
    .toc-entry.d2 { color: var(--ink-soft); font-size: 12px; }

    /* Chat tab */
    .chat-panel { display: flex; flex-direction: column; height: 100%; }
    .chat-header-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; border-bottom: 1px solid var(--line); flex-shrink: 0;
    }
    .chat-header-bar span { font-size: 12px; color: var(--ink-soft); }
    .chat-header-actions { display: flex; gap: 10px; align-items: center; }
    .chat-action-btn { background: none; border: none; color: var(--ink-soft); font-size: 11px; cursor: pointer; text-decoration: underline; transition: color 0.12s; }
    .chat-action-btn:hover { color: var(--ink); }
    .chat-action-btn.danger:hover { color: #B4433A; }
    .chat-key-setup { padding: 22px 18px; font-size: 13px; color: var(--ink-soft); line-height: 1.65; }
    .chat-key-setup strong { color: var(--ink); }
    .chat-key-setup a { color: var(--accent); }
    .chat-key-input {
      width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius);
      font-size: 13px; font-family: var(--sans); margin: 12px 0 10px; outline: none;
      transition: border-color 0.15s;
    }
    .chat-key-input:focus { border-color: var(--accent); }
    .chat-messages { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
    .chat-msg {
      font-size: 13px; line-height: 1.55; padding: 9px 13px;
      border-radius: 12px; max-width: 93%; white-space: pre-wrap; word-break: break-word;
    }
    .chat-msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-radius: 12px 12px 3px 12px; }
    .chat-msg.model { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-radius: 12px 12px 12px 3px; }
    .chat-msg.pending { color: var(--ink-soft); font-style: italic; background: #fff; border: 1px solid var(--line); }
    .chat-empty { padding: 22px 18px; font-size: 13px; color: var(--ink-soft); line-height: 1.65; }
    .chat-input-row { display: flex; gap: 7px; padding: 10px; border-top: 1px solid var(--line); flex-shrink: 0; }
    .chat-textarea {
      flex: 1; resize: none; border: 1px solid var(--line); border-radius: var(--radius);
      padding: 8px 11px; font-family: var(--sans); font-size: 13px; min-height: 38px;
      max-height: 100px; outline: none; transition: border-color 0.15s; line-height: 1.4;
    }
    .chat-textarea:focus { border-color: var(--accent); }
    .chat-send-btn {
      background: var(--accent); color: #fff; border: none; border-radius: var(--radius);
      padding: 0 14px; cursor: pointer; font-size: 13px; transition: background 0.15s;
      align-self: flex-end; height: 38px;
    }
    .chat-send-btn:hover { background: var(--accent-hover); }
    .chat-send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  </style>
</head>
<body>
<div id="app-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
'use strict';

// Register PWA Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}

pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ============================================================
// Constants
// ============================================================
const COLORS = [
  { name: 'ámbar',  hex: '#E9B949' },
  { name: 'salvia', hex: '#7FAE8C' },
  { name: 'rosa',   hex: '#D98CAA' },
  { name: 'cielo',  hex: '#7CB2D9' },
];
const GEMINI_KEY_LS  = 'readily_gemini_key';
const GEMINI_API_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent';
const MAX_CHAT_CONTEXT = 30; // last N messages sent to API

// ============================================================
// State
// ============================================================
const state = {
  view: 'connect',             // connect | auth | library | reader
  sb: null, session: null,
  authMode: 'login', authError: '',
  documents: [], currentDoc: null,
  pdf: null, pageNum: 1, numPages: 0, scale: 1.25,
  highlights: [], sidebarOpen: true, saving: false,
  sidebarTab: 'highlights',
  geminiKey: localStorage.getItem(GEMINI_KEY_LS) || '',
  chatMessages: [], docFullText: '', chatBusy: false,
  searchQuery: '', searchResults: [], searchResultIdx: -1,
  searchBarOpen: false, searchIndex: [],
  tocEntries: [], loading: false,
};

// ============================================================
// Utilities
// ============================================================
const root   = document.getElementById('app-root');
const uid    = () => 'h' + Math.random().toString(36).slice(2, 10);
const esc    = s => String(s).replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ============================================================
// Render dispatcher
// ============================================================
function render() {
  if (state.loading)          return renderLoading();
  if (state.view === 'connect') return renderConnect();
  if (state.view === 'auth')    return renderAuth();
  if (state.view === 'library') return renderLibrary();
  if (state.view === 'reader')  return renderReaderShell();
}

// ============================================================
// Loading screen
// ============================================================
function renderLoading(label = 'Cargando…') {
  root.innerHTML = `
    <div class="loading-screen">
      <div class="spinner"></div>
      <span class="loading-label">${esc(label)}</span>
    </div>`;
}

// ============================================================
// Connect screen
// ============================================================
function renderConnect() {
  root.innerHTML = `
    <div class="screen"><div class="card">
      <div class="card-logo">Readily</div>
      <div class="card-tagline">Tu lector personal de PDFs</div>
      <h2>Conecta tu nube</h2>
      <p class="card-hint">Pega los datos de tu proyecto Supabase (Settings → API). Solo se usan en tu navegador.</p>
      <div class="field"><label>Project URL</label><input id="sb-url" placeholder="https://xxxx.supabase.co"></div>
      <div class="field"><label>Anon public key</label><input id="sb-key" placeholder="eyJhbGciOi…"></div>
      <button class="btn-primary" id="connect-btn">Conectar</button>
      <div class="error-msg" id="connect-error"></div>
    </div></div>`;

  document.getElementById('connect-btn').addEventListener('click', async () => {
    const url    = document.getElementById('sb-url').value.trim();
    const key    = document.getElementById('sb-key').value.trim();
    const errEl  = document.getElementById('connect-error');
    if (!url || !key) { errEl.textContent = 'Completa ambos campos.'; return; }
    try {
      state.sb = window.supabase.createClient(url, key);
      const { data: { session } } = await state.sb.auth.getSession();
      state.session = session;
      state.view = session ? 'library' : 'auth';
      if (session) await loadDocuments();
      render();
    } catch (err) {

async function onUploadPdf(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  const progressEl = document.getElementById('upload-progress');
  progressEl.style.display = 'block';
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    progressEl.textContent = `Subiendo ${i + 1} de ${files.length}: ${file.name}…`;
    const path = `${state.session.user.id}/${Date.now()}_${file.name}`;
    const { error: upErr } = await state.sb.storage.from('pdfs').upload(path, file);
    if (upErr) { alert('Error al subir: ' + upErr.message); continue; }
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    await state.sb.from('documents').insert({
      title: file.name.replace(/\.pdf$/i, ''), storage_path: path, num_pages: pdf.numPages
    });
  }
  progressEl.style.display = 'none';
  await loadDocuments();
  renderLibrary();
}

// ============================================================
// Open document
// ============================================================
async function openDocument(docId) {
  renderLoading('Abriendo documento…');
  const doc = state.documents.find(d => d.id === docId);
  if (!doc) { state.view = 'library'; render(); return; }
  state.currentDoc = doc;

  try {
    // Download PDF
    const { data: fileData, error: dlErr } = await state.sb.storage.from('pdfs').download(doc.storage_path);
    if (dlErr) throw dlErr;
    const buf = await fileData.arrayBuffer();
    state.pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    state.numPages = state.pdf.numPages;

    // Reading progress
    const { data: progress } = await state.sb.from('reading_progress')
      .select('page').eq('document_id', docId).maybeSingle();
    state.pageNum = progress?.page || 1;

    // Highlights
    const { data: hls } = await state.sb.from('highlights').select('*').eq('document_id', docId);
    state.highlights = (hls || []).map(h => ({
      id: h.id, page: h.page, rects: h.rects, color: h.color, text: h.text, note: h.note || ''
    }));

    // Chat history (Block A)
    const { data: chatHist } = await state.sb.from('chat_messages')
      .select('role, content').eq('document_id', docId).order('created_at');
    state.chatMessages = (chatHist || []).map(m => ({ role: m.role, text: m.content }));

    // TOC (Block B)
    state.tocEntries = (await state.pdf.getOutline()) || [];

    // Reset search state
    state.searchQuery = '';
    state.searchResults = [];
    state.searchResultIdx = -1;
    state.searchBarOpen = false;
    state.searchIndex = [];

    // Extract full text + build search index
    renderLoading('Indexando texto…');
    state.docFullText = await extractFullText(state.pdf);

    state.view = 'reader';
    renderReaderShell();
  } catch (err) {
    alert('Error al abrir el documento: ' + err.message);
    state.view = 'library';
    render();
  }
}

// ============================================================
// Text extraction + search index (Blocks A context + B search)
// ============================================================
async function extractFullText(pdf) {
  const MAX_CHARS = 400_000;
  let out = '';
  state.searchIndex = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page    = await pdf.getPage(i);
    const content = await page.getTextContent();
    const pageText = content.items.map(it => it.str).join(' ');
    state.searchIndex.push({ page: i, text: pageText });
    out += `\n\n[Página ${i}]\n${pageText}`;
    if (out.length > MAX_CHARS) {
      out = out.slice(0, MAX_CHARS) + '\n\n[…documento truncado por longitud…]';
      break;
    }
  }
  return out;
}

function toggleSearchBar() {
  state.searchBarOpen = !state.searchBarOpen;
  renderToolbar();

  if (!row) return;
  row.classList.toggle('hidden', !state.searchBarOpen);
  if (state.searchBarOpen) {
    renderSearchBar();
    setTimeout(() => document.getElementById('search-input')?.focus(), 40);
  } else {
    state.searchResults = [];
    state.searchQuery   = '';
    renderSearchResultsPanel();
  }
}

function renderSearchBar() {
  const row = document.getElementById('search-bar-row');
  if (!row) return;
  const count = state.searchResults.length;
  const idx   = state.searchResultIdx;
  row.innerHTML = `
    <input class="search-input" id="search-input" placeholder="Buscar en el documento…" value="${esc(state.searchQuery)}">
    <span class="search-count">${count > 0 ? `${idx + 1} / ${count}` : (state.searchQuery ? 'Sin resultados' : '')}</span>
    <button class="search-nav-btn" id="search-prev" title="Anterior" ${count === 0 ? 'disabled' : ''}>‹</button>
    <button class="search-nav-btn" id="search-next" title="Siguiente" ${count === 0 ? 'disabled' : ''}>›</button>
  `;
  let debounce;
  document.getElementById('search-input').addEventListener('input', e => {
    state.searchQuery = e.target.value;
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      doSearch(state.searchQuery);
      renderSearchBar();
      renderSearchResultsPanel();
    }, 260);
  });
  document.getElementById('search-input').addEventListener('keydown', e => {
    if (e.key === 'Escape') { state.searchBarOpen = false; toggleSearchBar(); }
    if (e.key === 'Enter')  navigateSearch(e.shiftKey ? -1 : 1);
  });
  document.getElementById('search-prev').addEventListener('click', () => navigateSearch(-1));
  document.getElementById('search-next').addEventListener('click', () => navigateSearch(1));
}

function doSearch(query) {
  const q = query.trim().toLowerCase();
  if (!q) { state.searchResults = []; state.searchResultIdx = -1; return; }
  const results = [];
  for (const { page, text } of state.searchIndex) {
    const lc = text.toLowerCase();
    let pos = 0, pageMatches = 0;
    while (pageMatches < 3) {
      const i = lc.indexOf(q, pos);
      if (i === -1) break;
      const s = Math.max(0, i - 40);
      const e = Math.min(text.length, i + q.length + 60);
      const before = esc(text.slice(s, i));
      const match  = esc(text.slice(i, i + q.length));
      const after  = esc(text.slice(i + q.length, e));
      results.push({
        page,
        snippet: `${s > 0 ? '…' : ''}${before}<em>${match}</em>${after}${e < text.length ? '…' : ''}`
      });
      pos = i + q.length;
      pageMatches++;
    }
  }
  state.searchResults   = results;
  state.searchResultIdx = results.length > 0 ? 0 : -1;
  if (results.length > 0) goToPage(results[0].page);
}

function navigateSearch(dir) {
  if (!state.searchResults.length) return;
  const n = (state.searchResultIdx + dir + state.searchResults.length) % state.searchResults.length;
  state.searchResultIdx = n;
  goToPage(state.searchResults[n].page);
  renderSearchBar();
  renderSearchResultsPanel();
}

function renderSearchResultsPanel() {
  const panel = document.getElementById('search-results-panel');
  if (!panel) return;
  if (!state.searchBarOpen || !state.searchResults.length) { panel.innerHTML = ''; return; }
  panel.innerHTML = `

  panel.querySelectorAll('.srp-item').forEach(el => {

  });
}

// ---- Block B: TOC ----
function renderTocTab() {
  const body = document.getElementById('sidebar-body');
  if (!state.tocEntries.length) {
    body.innerHTML = `<div class="empty-sidebar">Este PDF no incluye tabla de contenidos nativa.</div>`;
    return;
  }

  function renderEntries(items, depth) {
    return items.map(item => {
      const destAttr = JSON.stringify(item.dest).replace(/"/g, '&quot;');
      return `
        <div class="toc-entry d${Math.min(depth, 2)}" style="padding-left:${14 + depth * 12}px" data-dest="${destAttr}">
          <span class="toc-title">${esc(item.title || '(sin título)')}</span>
        </div>
        ${item.items?.length ? renderEntries(item.items, depth + 1) : ''}`;
    }).join('');
  }

  body.innerHTML = renderEntries(state.tocEntries, 0);
  body.querySelectorAll('.toc-entry').forEach(el => {
    el.addEventListener('click', async () => {
      try {
        const dest = JSON.parse(el.dataset.dest.replace(/&quot;/g, '"'));
        let resolved = dest;
        if (typeof dest === 'string') resolved = await state.pdf.getDestination(dest);
        if (!Array.isArray(resolved)) return;
        const pageIndex = await state.pdf.getPageIndex(resolved[0]);
        goToPage(pageIndex + 1);
      } catch (_) { /* invalid dest — ignore */ }
    });
  });
}

async function sendChatMessage(userText) {
  state.chatMessages.push({ role: 'user', text: userText });
  state.chatBusy = true;
  renderChatTab();

  const reply = await askGemini(userText);

  state.chatBusy = false;
  state.chatMessages.push({ role: 'model', text: reply });

  // Persist to Supabase (fire-and-forget)
  state.sb.from('chat_messages').insert([
    { document_id: state.currentDoc.id, role: 'user',  content: userText },
    { document_id: state.currentDoc.id, role: 'model', content: reply   },
  ]).then(() => {}).catch(() => {});

  renderChatTab();
}

async function askGemini(userText) {
  const sysPrompt = `Eres un asistente de lectura dentro de Readily, una app personal de PDF. El usuario está leyendo "${state.currentDoc?.title || ''}", actualmente en la página ${state.pageNum} de ${state.numPages}. Aquí tienes el texto extraído del documento completo (marcado con [Página N]):\n\n${state.docFullText}\n\nInstrucciones: responde siempre en español, de forma clara y directa. Menciona la página cuando cites algo.\n\nMUY IMPORTANTE: si te piden explicar un término o concepto, explícalo siempre en lenguaje simple con un ejemplo concreto. Si el documento no lo define, usa tu conocimiento general. Solo aclara brevemente si el documento no profundiza, pero nunca dejes de dar la explicación real.`;

  // Only send last N messages to avoid huge context / costs
  const contextMessages = state.chatMessages.slice(-MAX_CHAT_CONTEXT);

  try {
    const res  = await fetch(GEMINI_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': state.geminiKey },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: sysPrompt }] },
        contents: contextMessages.map(m => ({
          role: m.role === 'user' ? 'user' : 'model',
          parts: [{ text: m.text }]
        }))
      })
    });
    const data = await res.json();
    if (data.error) return `Error de la API: ${data.error.message}`;
    return data.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || 'No obtuve respuesta, intenta de nuevo.';
  } catch (err) {
    return `No se pudo conectar con Gemini: ${err.message}`;
  }
}

function explainSelection() {
  if (!pendingSelection) return;
  const { text, pageNum } = pendingSelection;
  hideSelectionToolbar();
  window.getSelection().removeAllRanges();
  state.sidebarOpen = true;
  state.sidebarTab  = 'chat';
  document.getElementById('sidebar')?.classList.remove('hidden');
  renderToolbar();
  renderSidebar();
  sendChatMessage(`Explícame qué significa esto, en términos simples y con un ejemplo (está en la página ${pageNum}): "${text}"`);
}

// ============================================================
// Page navigation & rendering
// ============================================================
function setSaving(v) {
  state.saving = v;
  const dot = document.querySelector('.sync-dot');
  if (dot) { dot.classList.toggle('saving', v); dot.title = v ? 'Guardando…' : 'Guardado en la nube'; }
}

async function goToPage(n) {
  n = Math.max(1, Math.min(state.numPages, n));
  state.pageNum = n;
  renderToolbar();
  renderPage(n);
  setSaving(true);
  await state.sb.from('reading_progress').upsert(
    { document_id: state.currentDoc.id, page: n, updated_at: new Date().toISOString() },
    { onConflict: 'document_id,user_id' }
  );
  setSaving(false);
}

async function renderPage(num) {
  const page     = await state.pdf.getPage(num);
  const viewport = page.getViewport({ scale: state.scale });
  const pageWrap = document.getElementById('page-wrap');
  pageWrap.innerHTML = '';
  pageWrap.style.width  = viewport.width  + 'px';
  pageWrap.style.height = viewport.height + 'px';

  // Canvas
  const canvas = document.createElement('canvas');
  canvas.width  = viewport.width;
  canvas.height = viewport.height;
  pageWrap.appendChild(canvas);
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

  // Highlight layer
  const hlLayer = document.createElement('div');
  hlLayer.className = 'highlight-layer'; hlLayer.id = 'highlight-layer';
  pageWrap.appendChild(hlLayer);

  // Text layer
  const textDiv = document.createElement('div');
  textDiv.className = 'textLayer'; textDiv.id = 'text-layer';
  textDiv.style.width  = viewport.width  + 'px';
  textDiv.style.height = viewport.height + 'px';
  pageWrap.appendChild(textDiv);

  const textContent = await page.getTextContent();
  await pdfjsLib.renderTextLayer({ textContentSource: textContent, container: textDiv, viewport }).promise;

  drawHighlightLayer(num);
  drawMarginStrip(num);
  textDiv.addEventListener('mouseup', () => onSelectionEnd(num));
}

function drawHighlightLayer(pageNum) {
  const layer = document.getElementById('highlight-layer');
  if (!layer) return;
  layer.innerHTML = '';
  state.highlights.filter(h => h.page === pageNum).forEach(h => {
    h.rects.forEach(r => {
      const div = document.createElement('div');
      div.className = 'hl-rect'; div.dataset.hid = h.id;
      div.style.left   = (r.x * 100) + '%';
      div.style.top    = (r.y * 100) + '%';
      div.style.width  = (r.w * 100) + '%';
      div.style.height = (r.h * 100) + '%';
      div.style.background = h.color;
      div.title = h.note || h.text.slice(0, 60);
      div.addEventListener('click', () => flashSidebarItem(h.id));
      layer.appendChild(div);
    });
  });
}

function drawMarginStrip(pageNum) {
  const strip    = document.getElementById('margin-strip');
  const pageWrap = document.getElementById('page-wrap');
  if (!strip || !pageWrap) return;
  strip.innerHTML = '';
  strip.style.height = pageWrap.style.height;
  state.highlights.filter(h => h.page === pageNum).forEach(h => {
    const top  = h.rects[0].y * parseFloat(pageWrap.style.height);
    const tick = document.createElement('div');
    tick.className = 'tick'; tick.style.top = top + 'px'; tick.style.background = h.color;
    tick.title = h.text.slice(0, 60);
    tick.addEventListener('click', () => flashSidebarItem(h.id));
    strip.appendChild(tick);
  });
}

function flashSidebarItem(id) {
  if (!state.sidebarOpen) {
    state.sidebarOpen = true;
    document.getElementById('sidebar')?.classList.remove('hidden');
    renderToolbar();
  }
  if (state.sidebarTab !== 'highlights') { state.sidebarTab = 'highlights'; renderSidebar(); }
  const el = document.querySelector(`.hl-item[data-id="${id}"]`);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 900);
}

// ============================================================
// Selection → highlight / explain
// ============================================================
let pendingSelection = null;

function onSelectionEnd(pageNum) {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) { hideSelectionToolbar(); return; }
  const text = sel.toString().trim();
  if (!text) { hideSelectionToolbar(); return; }
  const range    = sel.getRangeAt(0);
  const textDiv  = document.getElementById('text-layer');
  if (!textDiv?.contains(range.commonAncestorContainer)) { hideSelectionToolbar(); return; }
  const pageBox    = textDiv.getBoundingClientRect();
  const clientRects = Array.from(range.getClientRects()).filter(r => r.width > 0 && r.height > 0);
  if (!clientRects.length) { hideSelectionToolbar(); return; }
  const rects = clientRects.map(r => ({
    x: (r.left - pageBox.left) / pageBox.width,
    y: (r.top  - pageBox.top)  / pageBox.height,
    w: r.width  / pageBox.width,
    h: r.height / pageBox.height,
  }));
  pendingSelection = { pageNum, rects, text };
  showSelectionToolbar(clientRects[0], pageBox);
}

function showSelectionToolbar(firstRect, pageBox) {
  let bar = document.getElementById('selection-toolbar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'selection-toolbar'; bar.className = 'selection-toolbar';
    document.getElementById('page-wrap').appendChild(bar);
  }
  bar.innerHTML =
    COLORS.map(c => `<div class="swatch-dot" data-color="${c.hex}" style="background:${c.hex}" title="Subrayar en ${c.name}"></div>`).join('') +
    `<div class="sel-divider"></div><button class="explain-btn" id="explain-btn">✨ Explicar</button>`;
  bar.style.left    = (firstRect.left - pageBox.left + firstRect.width / 2) + 'px';
  bar.style.top     = (firstRect.top  - pageBox.top  - 10) + 'px';
  bar.style.display = 'flex';

  bar.querySelectorAll('.swatch-dot').forEach(dot => {
    dot.addEventListener('mousedown', e => e.stopPropagation());
    dot.addEventListener('click', () => commitHighlight(dot.dataset.color));
  });
  document.getElementById('explain-btn').addEventListener('mousedown', e => e.stopPropagation());
  document.getElementById('explain-btn').addEventListener('click', explainSelection);
}

function hideSelectionToolbar() {
  const bar = document.getElementById('selection-toolbar');
  if (bar) bar.style.display = 'none';
  pendingSelection = null;
}

async function commitHighlight(color) {
  if (!pendingSelection) return;
  const { pageNum, rects, text } = pendingSelection;
  const localId = uid();
  state.highlights.push({ id: localId, page: pageNum, rects, color, text, note: '' });
  window.getSelection().removeAllRanges();
  hideSelectionToolbar();
  drawHighlightLayer(pageNum); drawMarginStrip(pageNum); renderSidebar();

  setSaving(true);
  const { data, error } = await state.sb.from('highlights').insert({
    document_id: state.currentDoc.id, page: pageNum, rects, color, text
  }).select().single();
  setSaving(false);

  if (!error && data) {
    const h = state.highlights.find(x => x.id === localId);
    if (h) h.id = data.id;
    renderSidebar();
  }
}

document.addEventListener('mousedown', e => {
  const bar = document.getElementById('selection-toolbar');
  if (bar && bar.style.display !== 'none' && !bar.contains(e.target)) hideSelectionToolbar();
});

// ============================================================
// Boot
// ============================================================
render();
</script>
</body>
</html>
