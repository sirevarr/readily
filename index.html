<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Readily</title>
  <meta name="description" content="Readily — Lector personal de PDFs con IA estilo Acrobat, racha de lectura y glosario.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1F1D1A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Readily">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Limpieza ÚNICA de la caché vieja de la v1 (no se repite, para no romper el modo offline) -->
  <script>
    (async function purgeStaleCachesOnce() {
      try {
        if (localStorage.getItem('readily_v2_purged')) return;
        localStorage.setItem('readily_v2_purged', '1');
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const r of regs) await r.unregister();
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const k of keys) await caches.delete(k);
        }
        location.reload();
      } catch (_) {}
    })();
  </script>

  <!-- Estilos de Readily v2 -->
  <link rel="stylesheet" href="css/style.css?v=2.2">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app-root"></div>

  <!-- Librerías locales en vendor/ para funcionamiento sin conexión -->
  <script src="vendor/supabase.js"></script>
  <script src="vendor/pdf.min.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
    // Configurar worker local de pdf.js
    if (window.pdfjsLib) {
      try {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = new URL('vendor/pdf.worker.min.js', window.location.href).href;
      } catch (_) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
      }
    }
  </script>

  <!-- Módulo de la aplicación v2 con sello de versión -->
  <script type="module">
    import { initApp } from './js/app.js?v=2.3';
    window.addEventListener('DOMContentLoaded', () => {
      initApp(document.getElementById('app-root'));
    });
  </script>
</body>
</html>
