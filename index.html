function setSaving(v) { state.saving = v; const d = document.querySelector('.sync-dot'); if (d) { d.classList.toggle('saving', v); d.title = v ? 'Guardando…' : 'Guardado'; } }

async function goToPage(n) {
  n = Math.max(1, Math.min(state.numPages, n));
  const prevPage = state.pageNum;
  state.pageNum = n;
  renderToolbar(); renderPage(n);
  setSaving(true);
  const now = new Date().toISOString();
  await state.sb.from('reading_progress').upsert({ document_id: state.currentDoc.id, page: n, updated_at: now, user_id: state.session.user.id }, { onConflict: 'document_id,user_id' });
  setSaving(false);

  // Actualizar historial de páginas de sesión (para quiz cross-referencing)
  if (!state.readingHistory.includes(n)) state.readingHistory.push(n);
  // Actualizar streakDates en la sesión actual
  const todayStr = new Date().toDateString();
  if (!state.streakDates.some(d => new Date(d).toDateString() === todayStr)) {
    state.streakDates.push(new Date());
    state.totalDaysRead = Math.max(state.totalDaysRead, state.streakDates.length);
    if (state.readingStreak === 0) state.readingStreak = 1;
  }

  // Quiz trigger: cada QUIZ_EVERY_N páginas avanzadas
  if (n > prevPage && state.geminiKey) {
    if (n - state.quizLastPage >= QUIZ_EVERY_N) {
      const recentPages = [];
      for (let p = state.quizLastPage + 1; p <= n; p++) recentPages.push(p);
      state.quizLastPage = n;
      const question = await generateQuizQuestion(recentPages.slice(-QUIZ_EVERY_N));
      if (question) showQuizPopup(question, recentPages.slice(-QUIZ_EVERY_N));
    }
  }

  // Chapter preview (solo cuando avanzamos)
  if (n > prevPage && n !== prevPage + 1) {
    maybeShowChapterPreview(n);
  }

  // Toast de capítulo completado (heurística: página con poco texto entre dos páginas normales)
  if (n > 1 && n % 10 === 0) {
    showToast('✅', `¡Página ${n} completada!`);
  }
}

async function renderPage(num) {
  const page = await state.pdf.getPage(num);
  const vp = page.getViewport({ scale: state.scale });
  const pw = document.getElementById('page-wrap'); pw.innerHTML = '';
  pw.style.width = vp.width + 'px'; pw.style.height = vp.height + 'px';

  const cv = document.createElement('canvas');
  cv.width = vp.width; cv.height = vp.height; pw.appendChild(cv);
  await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;

  const hl = document.createElement('div'); hl.className = 'highlight-layer'; hl.id = 'hl-layer'; pw.appendChild(hl);

  const td = document.createElement('div');
  td.className = 'textLayer'; td.id = 'text-layer';
  td.style.width = vp.width + 'px'; td.style.height = vp.height + 'px';
  td.style.setProperty('--scale-factor', vp.scale);
  pw.appendChild(td);

  const tc = await page.getTextContent();
  await pdfjsLib.renderTextLayer({ textContentSource: tc, container: td, viewport: vp }).promise;

  drawHL(num); drawMS(num);
  td.addEventListener('mouseup', () => onSelectionEnd(num));
  td.addEventListener('touchend', () => setTimeout(() => onSelectionEnd(num), 100));

  // Detectar páginas con contenido visual (poco texto extraído)
  detectVisualPage(num);
  // Si el modo visual está activo, re-montar el overlay de recorte
  if (state.visualMode) mountVisualCrop();

  if (state.pendingTextHighlight) {
    highlightTextInPage(state.pendingTextHighlight);
    state.pendingTextHighlight = null;
  }
}

function drawHL(pn) {
  const l = document.getElementById('hl-layer'); if (!l) return; l.innerHTML = '';
  state.highlights.filter(h => h.page === pn).forEach(h => h.rects.forEach(r => {
    const d = document.createElement('div'); d.className = 'hl-rect'; d.dataset.hid = h.id;
    d.style.left = (r.x*100)+'%'; d.style.top = (r.y*100)+'%'; d.style.width = (r.w*100)+'%'; d.style.height = (r.h*100)+'%';
    d.style.background = h.color; d.title = h.note || h.text.slice(0, 60);
    d.onclick = () => flashHL(h.id); l.appendChild(d);
  }));
}

function drawMS(pn) {
  const s = document.getElementById('margin-strip'), pw = document.getElementById('page-wrap');
  if (!s || !pw) return; s.innerHTML = ''; s.style.height = pw.style.height;
  state.highlights.filter(h => h.page === pn).forEach(h => {
    const top = h.rects[0].y * parseFloat(pw.style.height);
    const t = document.createElement('div'); t.className = 'tick'; t.style.top = top + 'px'; t.style.background = h.color;
    t.title = h.text.slice(0, 60); t.onclick = () => flashHL(h.id); s.appendChild(t);
  });
}

function flashHL(id) {
  if (!state.sidebarOpen) toggleSidebar(true);
  if (state.sidebarTab !== 'highlights') { state.sidebarTab = 'highlights'; renderSidebar(); }
  const el = document.querySelector(`.hl-item[data-id="${id}"]`);
  if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 900); }
}

function toggleVisualMode() {

    mountVisualCrop();

    document.getElementById('visual-crop-overlay')?.remove();
    document.getElementById('visual-badge')?.remove();

}

function mountVisualCrop() {
  // Remover overlay previo si existe
  document.getElementById('visual-crop-overlay')?.remove();
  const pw = document.getElementById('page-wrap');
  if (!pw) return;

  const overlay = document.createElement('div');
  overlay.id = 'visual-crop-overlay';
  overlay.className = 'crop-overlay';

  const hint = document.createElement('div');
  hint.className = 'crop-hint';
  hint.textContent = '📐 Arrastra para seleccionar un diagrama, fórmula o imagen';
  overlay.appendChild(hint);

  const rect = document.createElement('div');
  rect.className = 'crop-rect';
  rect.style.display = 'none';
  overlay.appendChild(rect);

  pw.appendChild(overlay);

  let dragging = false, startX = 0, startY = 0;

  overlay.addEventListener('mousedown', e => {
    if (!state.visualMode) return;
    dragging = true;
    const ob = overlay.getBoundingClientRect();
    startX = e.clientX - ob.left;
    startY = e.clientY - ob.top;
    rect.style.left = startX + 'px'; rect.style.top = startY + 'px';
    rect.style.width = '0'; rect.style.height = '0';
    rect.style.display = 'block';
    hint.style.display = 'none';
    e.preventDefault();
  });

  overlay.addEventListener('mousemove', e => {
    if (!dragging) return;
    const ob = overlay.getBoundingClientRect();
    const cx = e.clientX - ob.left, cy = e.clientY - ob.top;
    rect.style.left   = Math.min(cx, startX) + 'px';
    rect.style.top    = Math.min(cy, startY) + 'px';
    rect.style.width  = Math.abs(cx - startX) + 'px';
    rect.style.height = Math.abs(cy - startY) + 'px';
  });

  overlay.addEventListener('mouseup', async e => {
    if (!dragging) return;
    dragging = false;
    const ob = overlay.getBoundingClientRect();
    const cx = e.clientX - ob.left, cy = e.clientY - ob.top;
    const x = Math.min(cx, startX), y = Math.min(cy, startY);
    const w = Math.abs(cx - startX), h = Math.abs(cy - startY);
    rect.style.display = 'none';
    hint.style.display = '';
    if (w < 20 || h < 20) return; // selección demasiado pequeña
    await captureAndExplainRegion(x, y, w, h, overlay.getBoundingClientRect());
  });
}

async function captureAndExplainRegion(x, y, w, h, overlayRect) {
  // Capturar región del canvas de la página
  const cv = document.querySelector('#page-wrap canvas');
  if (!cv) { showToast('⚠️', 'No se encontró el canvas de la página'); return; }

  // Escalar coordenadas del overlay al canvas real
  const scaleX = cv.width  / overlayRect.width;
  const scaleY = cv.height / overlayRect.height;
  const cx = Math.round(x * scaleX), cy = Math.round(y * scaleY);
  const cw = Math.round(w * scaleX), ch = Math.round(h * scaleY);

  // Crear canvas temporal para el recorte
  const tmpCanvas = document.createElement('canvas');
  tmpCanvas.width = cw; tmpCanvas.height = ch;
  const ctx = tmpCanvas.getContext('2d');
  ctx.drawImage(cv, cx, cy, cw, ch, 0, 0, cw, ch);
  const dataUrl = tmpCanvas.toDataURL('image/jpeg', 0.88);
  const base64 = dataUrl.split(',')[1];

  if (!state.geminiKey) {
    showToast('🔑', 'Necesitas una clave Gemini para analizar elementos visuales');
    state.sidebarTab = 'chat'; toggleSidebar(true); renderSidebar(); return;
  }

  // Mostrar panel de explicación en modo cargando
  state.explainTerm = `Elemento visual — p.${state.pageNum}`;
  state.explainPage = state.pageNum;
  state.explainText = '';
  state.explainLoading = true;
  state.explainVisible = true;
  state.explainIsVisual = true;
  renderExplainPanel();

  // Llamar a Gemini Vision con imagen + texto
  const prompt = `Estás analizando un elemento visual (diagrama, fórmula, imagen, esquema, tabla o gráfico) extraído de la página ${state.pageNum} del documento "${state.currentDoc?.title || ''}".

${STYLE_BLOCK}

Describe e interpreta este elemento:
1. Qué tipo de elemento es.
2. Qué relación de causa-efecto o de base-regla-resultado representa (no solo qué "muestra" visualmente).
3. Cómo se conecta con el tema general del documento.

Máximo 4-5 líneas. Español, sin negrita, sin bullets.`;

  try {
    const r = await fetch(`${GEMINI_API}?key=${state.geminiKey}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          role: 'user',
          parts: [
            { inlineData: { mimeType: 'image/jpeg', data: base64 } },
            { text: prompt }
          ]
        }]
      })
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error.message);
    state.explainText = d.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || 'Sin respuesta.';
  } catch (err) {
    state.explainText = '⚠️ Error al analizar la imagen: ' + err.message;
  }
  state.explainLoading = false;
  state.explainIsVisual = true;
  if (state.explainVisible) renderExplainPanel();
}

function detectVisualPage(pageNum) {
  // Detecta si la página actual tiene mayoritariamente contenido visual (poco texto)
  document.getElementById('visual-badge')?.remove();
  const pageData = state.searchIndex.find(p => p.page === pageNum);
  if (!pageData) return;
  const wordCount = pageData.text.split(/\s+/).filter(w => w.length > 1).length;
  // Si tiene menos de 25 palabras, es probable que sea una página visual
  if (wordCount < 25) {
    const pw = document.getElementById('page-wrap');
    if (!pw) return;
    const badge = document.createElement('div');
    badge.id = 'visual-badge'; badge.className = 'visual-badge';
    badge.innerHTML = '📊 Contiene elementos visuales — <strong>modo 📐</strong> para analizar';
    badge.onclick = () => { if (!state.visualMode) toggleVisualMode(); };
    pw.appendChild(badge);
  }
}

// ============================================================
// Selection → highlight / explain
// ============================================================
let pendingSelection = null;

function onSelectionEnd(pageNum) {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) { hideSelectionToolbar(); return; }
  let text = sel.toString().trim();
  if (!text) { hideSelectionToolbar(); return; }
  text = cleanSelectedText(text, pageNum);
  if (!text || text.length < 2) { hideSelectionToolbar(); return; }
  const range = sel.getRangeAt(0);
  const td = document.getElementById('text-layer');
  if (!td?.contains(range.commonAncestorContainer)) { hideSelectionToolbar(); return; }
  const pb = td.getBoundingClientRect();
  const cr = Array.from(range.getClientRects()).filter(r => r.width > 0 && r.height > 0);
  if (!cr.length) { hideSelectionToolbar(); return; }
  const rects = cr.map(r => ({ x:(r.left-pb.left)/pb.width, y:(r.top-pb.top)/pb.height, w:r.width/pb.width, h:r.height/pb.height }));
  pendingSelection = { pageNum, rects, text };
  showSelectionToolbar(cr[0], pb);
}

function showSelectionToolbar(fr, pb) {
  let bar = document.getElementById('sel-tb');
  if (!bar) { bar = document.createElement('div'); bar.id = 'sel-tb'; bar.className = 'selection-toolbar'; document.getElementById('page-wrap').appendChild(bar); }
  bar.innerHTML = COLORS.map(c => `<div class="swatch-dot" data-c="${c.hex}" style="background:${c.hex}" title="${c.name}"></div>`).join('') +
    `<div class="sel-divider"></div><button class="explain-btn" id="ex-btn">✨ Explicar</button><button class="explain-btn" id="ask-btn">💬 Preguntar</button>`;
  bar.style.left = (fr.left - pb.left + fr.width / 2) + 'px';
  bar.style.top = (fr.top - pb.top - 10) + 'px';
  bar.style.display = 'flex';
  bar.querySelectorAll('.swatch-dot').forEach(dot => { dot.onmousedown = e => e.stopPropagation(); dot.onclick = () => commitHL(dot.dataset.c); });
  document.getElementById('ex-btn').onmousedown = e => e.stopPropagation();
  document.getElementById('ex-btn').onclick = explainSelection;
  document.getElementById('ask-btn').onmousedown = e => e.stopPropagation();
  document.getElementById('ask-btn').onclick = askAboutSelection;
}

function hideSelectionToolbar() { const b = document.getElementById('sel-tb'); if (b) b.style.display = 'none'; pendingSelection = null; }

async function commitHL(color) {
  if (!pendingSelection) return;
  const { pageNum, rects, text } = pendingSelection;
  const lid = uid();
  state.highlights.push({ id: lid, page: pageNum, rects, color, text, note: '' });
  window.getSelection().removeAllRanges(); hideSelectionToolbar();
  drawHL(pageNum); drawMS(pageNum); renderSidebar();
  setSaving(true);
  const { data, error } = await state.sb.from('highlights').insert({ document_id: state.currentDoc.id, page: pageNum, rects, color, text, user_id: state.session.user.id }).select().single();
  setSaving(false);
  if (!error && data) { const h = state.highlights.find(x => x.id === lid); if (h) h.id = data.id; renderSidebar(); }
}

document.addEventListener('mousedown', e => {
  const b = document.getElementById('sel-tb');
  if (b && b.style.display !== 'none' && !b.contains(e.target)) hideSelectionToolbar();
  
  const cb = document.getElementById('chat-sel-tb');
  if (cb && cb.style.display !== 'none' && !cb.contains(e.target)) hideChatSelectionToolbar();
});

// ---- Resaltado temporal del texto citado ----
function highlightTextInPage(searchText) {
  const cleanSearch = searchText.trim().toLowerCase().replace(/\s+/g, ' ');
  if (!cleanSearch || cleanSearch.length < 5) return;
  const container = document.getElementById('text-layer');
  if (!container) return;
  const divs = Array.from(container.querySelectorAll('span, div'));
  
  let found = false;
  // Intento 1: buscar coincidencia directa en el div
  for (const div of divs) {
    const divText = div.textContent.toLowerCase().replace(/\s+/g, ' ');
    if (divText.includes(cleanSearch) || (cleanSearch.includes(divText) && divText.length > 8)) {
      div.classList.add('temp-highlight');
      found = true;
    }
  }
  
  // Intento 2: si no se encontró por fragmentación del textLayer, buscar por palabras clave significativas
  if (!found) {
    const words = cleanSearch.split(' ').filter(w => w.length > 4);
    if (words.length > 0) {
      divs.forEach(div => {
        const divText = div.textContent.toLowerCase();
        if (words.some(w => divText.includes(w))) {
          div.classList.add('temp-highlight');
        }
      });
    }
  }
  
  // Desvanecer y remover
  setTimeout(() => {
    container.querySelectorAll('.temp-highlight').forEach(el => {
      el.classList.add('fade-out');
      setTimeout(() => {
        el.classList.remove('temp-highlight', 'fade-out');
      }, 800);
    });
  }, 3500);
}

// ---- Selección de texto dentro de mensajes de Chat ----
function handleChatSelection() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) { hideChatSelectionToolbar(); return; }
  const text = sel.toString().trim();
  if (!text || text.length < 2) { hideChatSelectionToolbar(); return; }
  
  // Validar si la selección ocurrió dentro del panel de mensajes
  const range = sel.getRangeAt(0);
  const chatContainer = document.getElementById('cm');
  if (!chatContainer || !chatContainer.contains(range.commonAncestorContainer)) { return; }
  
  const rects = range.getClientRects();
  if (!rects.length) return;
  const r = rects[0];
  
  showChatSelectionToolbar(r, text);
}

function showChatSelectionToolbar(r, text) {
  let bar = document.getElementById('chat-sel-tb');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'chat-sel-tb';
    bar.className = 'selection-toolbar chat-sel';
    document.body.appendChild(bar);
  }
  bar.innerHTML = `<button class="explain-btn" id="chat-ex-btn">✨ Explicar</button>
                   <button class="explain-btn" id="chat-ask-btn">💬 Preguntar</button>`;
  
  bar.style.position = 'fixed';
  bar.style.left = (r.left + r.width / 2) + 'px';
  bar.style.top = (r.top - 48) + 'px';
  bar.style.display = 'flex';
  bar.style.zIndex = '1000';
  
  document.getElementById('chat-ex-btn').onmousedown = e => e.stopPropagation();
  document.getElementById('chat-ex-btn').onclick = () => {
    hideChatSelectionToolbar();
    window.getSelection().removeAllRanges();
    if (!state.geminiKey) { state.sidebarTab = 'chat'; toggleSidebar(true); renderSidebar(); return; }
    triggerExplain(text, state.pageNum);
  };
  
  document.getElementById('chat-ask-btn').onmousedown = e => e.stopPropagation();
  document.getElementById('chat-ask-btn').onclick = () => {
    hideChatSelectionToolbar();
    window.getSelection().removeAllRanges();
    state.chatCitation = text;
    renderChatTab();
    setTimeout(() => document.getElementById('ci')?.focus(), 50);
  };
}

function hideChatSelectionToolbar() {
  const bar = document.getElementById('chat-sel-tb');
  if (bar) bar.style.display = 'none';
}

document.addEventListener('mouseup', (e) => {
  // No procesar si el click fue dentro del propio toolbar (evita destruir el handler antes del click)
  const chatBar = document.getElementById('chat-sel-tb');
  if (chatBar && chatBar.contains(e.target)) return;
  handleChatSelection();
});
document.addEventListener('touchend', (e) => {
  const chatBar = document.getElementById('chat-sel-tb');
  if (chatBar && chatBar.contains(e.target)) return;
  setTimeout(handleChatSelection, 100);
});

// ============================================================
// Boot
// ============================================================
async function boot() {
  const sbU = localStorage.getItem(SB_URL_LS), sbK = localStorage.getItem(SB_KEY_LS);
  if (sbU && sbK) {
    renderLoading('Conectando…');
    try {
      state.sb = window.supabase.createClient(sbU, sbK);
      const { data: { session } } = await state.sb.auth.getSession();
      if (session) { state.session = session; state.view = 'library'; await loadDocuments(); }
      else state.view = 'auth';
    } catch (_) { state.view = 'connect'; }
  }
  render();
}
boot();
</script>
