<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Readily</title>
  <meta name="description" content="Tu lector personal de PDFs con subrayados, notas y chat con IA.">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#201E1B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Readily">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/web/pdf_viewer.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper:#F3EFE6;--ink:#262421;--ink-soft:#5B564E;
      --spine:#201E1B;--spine-text:#F3EFE6;
      --accent:#3F6E63;--accent-h:#34594f;--accent-soft:#DCE7E3;
      --line:#DDD5C4;--sidebar-bg:#FBF9F4;
      --serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;
      --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      --r:10px;--shadow:0 8px 28px rgba(38,36,33,.1);
      --warn:#E9B949;--danger:#B4433A;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:var(--sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
    #app-root{min-height:100vh;display:flex;flex-direction:column}

    .loading-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
    .spinner{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite}
    .loading-label{font-size:14px;color:var(--ink-soft)}
    @keyframes spin{to{transform:rotate(360deg)}}

    .screen{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:36px 32px;width:100%;max-width:420px;box-shadow:var(--shadow)}
    .card-logo{font-family:var(--serif);font-style:italic;font-size:30px;color:var(--accent);margin-bottom:2px}
    .card-tagline{color:var(--ink-soft);font-size:13px;margin-bottom:28px}
    .card h2{font-size:18px;font-weight:600;margin-bottom:6px}
    .card-hint{color:var(--ink-soft);font-size:13px;line-height:1.55;margin-bottom:22px}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:12px;font-weight:500;color:var(--ink-soft);margin-bottom:5px}
    .field input{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:var(--r);font-size:14px;font-family:var(--sans);outline:none;transition:border-color .15s}
    .field input:focus{border-color:var(--accent)}
    .btn-primary{width:100%;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:var(--r);font-size:14px;font-weight:500;cursor:pointer;margin-top:6px;transition:background .15s}
    .btn-primary:hover{background:var(--accent-h)}
    .btn-link{background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;padding:0;text-decoration:underline;margin-top:16px;display:block}
    .error-msg{color:#B4433A;font-size:13px;margin-top:10px;line-height:1.4}
    .ok-msg{color:var(--accent);font-size:13px;margin-top:10px;line-height:1.4}

    /* ============================================================
       LIBRARY — grid mejorado
       ============================================================ */
    .library-wrap{flex:1;padding:44px 24px 80px;max-width:900px;margin:0 auto;width:100%}
    .library-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;gap:16px;flex-wrap:wrap}
    .library-title{font-family:var(--serif);font-style:italic;font-weight:400;font-size:30px}
    .library-title span{display:block;font-family:var(--sans);font-style:normal;font-size:13px;color:var(--ink-soft);font-weight:400;margin-top:3px}
    .library-actions{display:flex;gap:10px;align-items:center;margin-top:4px;flex-wrap:wrap}
    .upload-btn{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,transform .1s;display:flex;align-items:center;gap:6px}
    .upload-btn:hover{background:var(--accent-h);transform:translateY(-1px)}
    .upload-btn input{display:none}
    .logout-link,.disconnect-btn{background:none;border:none;color:var(--ink-soft);font-size:12px;cursor:pointer;text-decoration:underline}
    .upload-progress{font-size:13px;color:var(--ink-soft);margin-bottom:14px;padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);display:none}

    /* Filtro de categorías */
    .category-filter-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
    .cat-chip{padding:6px 14px;border-radius:999px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);transition:all .15s}
    .cat-chip:hover{border-color:var(--accent);color:var(--accent)}
    .cat-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

    /* Grid de libros */
    .doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
    .doc-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;transition:all .2s;position:relative;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 8px rgba(38,36,33,.06)}
    .doc-card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(38,36,33,.14);border-color:var(--accent-soft)}
    .doc-card-emoji{font-size:28px;line-height:1}
    .doc-card-title{font-size:14px;font-weight:600;line-height:1.35;color:var(--ink)}
    .doc-card-meta{font-size:11.5px;color:var(--ink-soft);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .doc-category-chip{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:2px 7px;font-size:10.5px;font-weight:600}
    .doc-progress-wrap{background:var(--line);border-radius:999px;height:4px;width:100%;overflow:hidden}
    .doc-progress-bar{background:var(--accent);height:4px;border-radius:999px;transition:width .4s ease}
    .doc-progress-label{font-size:11px;color:var(--ink-soft)}
    .doc-card-actions{display:flex;gap:6px;margin-top:4px}
    .doc-btn{background:none;border:1px solid var(--line);color:var(--ink-soft);font-size:11.5px;padding:5px 10px;border-radius:7px;cursor:pointer;transition:all .12s;font-family:var(--sans)}
    .doc-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
    .doc-btn.danger:hover{border-color:var(--danger);color:var(--danger);background:rgba(180,67,58,.07)}
    .empty-lib{color:var(--ink-soft);font-size:14px;text-align:center;padding:64px 20px;line-height:1.8;grid-column:1/-1}

    /* Banner "próximamente" */
    .coming-soon-banner{background:linear-gradient(135deg,#201E1B 0%,#3F6E63 100%);color:#fff;border-radius:14px;padding:18px 22px;display:flex;align-items:center;gap:14px;margin-bottom:24px}
    .csb-icon{font-size:26px;flex-shrink:0}
    .csb-text{font-size:13px;line-height:1.5;opacity:.9}
    .csb-text strong{display:block;font-size:14px;opacity:1;margin-bottom:2px}

    /* ---- READER ---- */
    .reader-header{position:sticky;top:0;z-index:20}
    .spine{background:var(--spine);color:var(--spine-text);display:flex;align-items:center;gap:10px;padding:9px 16px;flex-wrap:wrap}
    .brand{font-family:var(--serif);font-style:italic;font-size:18px;margin-right:4px;white-space:nowrap;cursor:pointer;opacity:.85;user-select:none}
    .brand:hover{opacity:1}
    .spine-sep{width:1px;height:20px;background:rgba(255,255,255,.12);flex-shrink:0}
    .spine-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:var(--spine-text);padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap;line-height:1;transition:background .12s}
    .spine-btn:hover{background:rgba(255,255,255,.16)}
    .spine-btn:disabled{opacity:.3;cursor:not-allowed}
    .spine-btn.active{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.38)}
    .pagectl{display:flex;align-items:center;gap:6px;font-size:13px}
    .pagectl input{width:48px;text-align:center;padding:5px 4px;border-radius:7px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:var(--spine-text);font-size:13px;outline:none}
    .page-total{font-size:13px;opacity:.55}
    .spacer{flex:1}
    .sync-dot{width:7px;height:7px;border-radius:50%;background:#7FAE8C;flex-shrink:0}
    .sync-dot.saving{background:#E9B949;animation:pulse 1s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.9}50%{opacity:.35}}

    /* Streak badge en spine */
    .streak-badge{display:flex;align-items:center;gap:4px;background:rgba(233,185,73,.18);border:1px solid rgba(233,185,73,.35);border-radius:999px;padding:4px 10px;font-size:12px;color:#E9B949;white-space:nowrap}

    .search-bar-row{background:#181512;padding:7px 14px;display:flex;gap:8px;align-items:center;border-top:1px solid rgba(255,255,255,.05)}
    .search-bar-row.hidden{display:none}
    .search-input{flex:1;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);color:var(--spine-text);border-radius:8px;padding:7px 12px;font-size:13px;font-family:var(--sans);outline:none}
    .search-input::placeholder{color:rgba(255,255,255,.38)}
    .search-count{font-size:12px;color:rgba(255,255,255,.45);white-space:nowrap;min-width:70px;text-align:right}
    .search-nav-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:var(--spine-text);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .search-nav-btn:disabled{opacity:.28;cursor:not-allowed}
    .search-results-panel{background:#fff;border:1px solid var(--line);border-top:none;max-height:210px;overflow-y:auto;box-shadow:0 10px 28px rgba(0,0,0,.13)}
    .srp-item{padding:9px 16px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px;display:flex;align-items:baseline;gap:10px}
    .srp-item:hover{background:var(--accent-soft)}
    .srp-item.active{background:#EEF4F2}
    .srp-page{font-size:11px;color:var(--ink-soft);background:var(--line);padding:2px 6px;border-radius:4px;flex-shrink:0;font-weight:500}
    .srp-snippet{flex:1;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .srp-snippet em{background:rgba(233,185,73,.38);font-style:normal;color:var(--ink);padding:0 1px;border-radius:2px}

    .workspace{flex:1;display:flex;min-height:0;position:relative}
    .stage{flex:1;overflow:auto;display:flex;justify-content:center;padding:36px 16px}
    .page-frame{display:flex;gap:12px;align-items:flex-start}
    .page-wrap{position:relative;background:#fff;box-shadow:0 8px 32px rgba(38,36,33,.18)}
    .highlight-layer{position:absolute;inset:0;pointer-events:none}
    .hl-rect{position:absolute;mix-blend-mode:multiply;border-radius:2px;pointer-events:auto;cursor:pointer}

    /* Cursor de selección más visible */
    .textLayer{cursor:text}
    .textLayer ::selection{background:rgba(63,110,99,.55) !important}
    .textLayer ::-moz-selection{background:rgba(63,110,99,.55) !important}

    .selection-toolbar{position:absolute;display:flex;gap:6px;align-items:center;background:var(--spine);padding:7px 10px;border-radius:999px;box-shadow:0 8px 22px rgba(0,0,0,.28);z-index:30;transform:translate(-50%,-100%)}
    .selection-toolbar .swatch-dot{width:19px;height:19px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .1s}
    .selection-toolbar .swatch-dot:hover{transform:scale(1.2);box-shadow:0 0 0 2px rgba(255,255,255,.35)}
    .selection-toolbar::after{content:'';position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border-width:5px 5px 0 5px;border-style:solid;border-color:var(--spine) transparent transparent transparent}
    .sel-divider{width:1px;height:16px;background:rgba(255,255,255,.22)}
    .explain-btn{background:rgba(255,255,255,.1);color:var(--spine-text);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;white-space:nowrap;transition:background .12s}
    .explain-btn:hover{background:rgba(255,255,255,.2)}
    .margin-strip{width:14px;align-self:stretch;position:relative;border-left:1px dashed var(--line)}
    .tick{position:absolute;left:3px;width:8px;height:3px;border-radius:2px;cursor:pointer}
    .tick:hover{transform:scaleX(1.5)}

    /* ---- SIDEBAR ---- */
    .sidebar{width:310px;background:var(--sidebar-bg);border-left:1px solid var(--line);overflow:hidden;flex-shrink:0;display:flex;flex-direction:column}
    .sidebar.hidden{display:none}
    .sidebar-tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0;overflow-x:auto}
    .sidebar-tabs::-webkit-scrollbar{display:none}
    .sidebar-tabs button{flex-shrink:0;background:none;border:none;padding:11px 7px;font-size:11px;cursor:pointer;color:var(--ink-soft);border-bottom:2px solid transparent;white-space:nowrap;font-family:var(--sans);font-weight:500}
    .sidebar-tabs button.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
    .fc-badge{display:inline-block;background:var(--accent);color:#fff;border-radius:99px;font-size:9px;padding:1px 5px;margin-left:3px;font-weight:700;vertical-align:middle}
    .sidebar-body{flex:1;overflow-y:auto;display:flex;flex-direction:column}

    .hl-item{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;cursor:pointer;transition:background .1s}
    .hl-item:hover{background:var(--accent-soft)}
    .hl-item.flash{background:var(--accent-soft)}
    .hl-bar{width:4px;border-radius:2px;flex-shrink:0;margin-top:2px}
    .hl-body{flex:1;min-width:0}
    .hl-page{font-size:11px;color:var(--ink-soft);margin-bottom:3px}
    .hl-text{font-size:13px;line-height:1.45}
    .hl-note{margin-top:7px;width:100%;font-size:12px;font-family:var(--sans);padding:6px 8px;border:1px solid var(--line);border-radius:7px;resize:vertical;min-height:34px;outline:none;background:#fff}
    .hl-note:focus{border-color:var(--accent)}
    .hl-actions{display:flex;gap:8px;margin-top:6px}
    .hl-actions button{background:none;border:none;color:var(--ink-soft);font-size:11px;cursor:pointer;padding:0;text-decoration:underline}
    .hl-actions button:hover{color:#B4433A}
    .empty-sidebar{padding:22px 18px;font-size:13px;color:var(--ink-soft);line-height:1.65}

    .toc-entry{display:flex;align-items:baseline;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px;line-height:1.4}
    .toc-entry:hover{background:var(--accent-soft)}
    .toc-title{flex:1}
    .toc-entry.d0{font-weight:600}
    .toc-entry.d1,.toc-entry.d2{color:var(--ink-soft);font-size:12px}

    /* ---- FLASHCARDS 3D ---- */
    .fc-container{padding:16px;display:flex;flex-direction:column;gap:14px}
    .fc-nav{display:flex;align-items:center;justify-content:center;gap:14px}
    .fc-nav-btn{background:var(--accent-soft);border:none;color:var(--ink);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
    .fc-nav-btn:hover{background:var(--accent);color:#fff}
    .fc-count{font-size:13px;color:var(--ink-soft);min-width:50px;text-align:center}
    .fc-card{perspective:1200px;cursor:pointer;min-height:190px}
    .fc-inner{width:100%;min-height:190px;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1)}
    .fc-card.flipped .fc-inner{transform:rotateY(180deg)}
    .fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .fc-front{background:var(--spine);color:var(--spine-text)}
    .fc-back{background:#fff;border:1px solid var(--line);transform:rotateY(180deg);overflow-y:auto;justify-content:flex-start;align-items:flex-start}
    .fc-term{font-family:var(--serif);font-style:italic;font-size:22px;text-align:center;line-height:1.3}
    .fc-tap-hint{font-size:11px;opacity:.4;margin-top:10px}
    .fc-back-text{font-size:13px;line-height:1.6;color:var(--ink);white-space:pre-wrap;word-break:break-word}
    .fc-delete-btn{background:none;border:1px solid var(--line);color:var(--ink-soft);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:12px;align-self:center}
    .fc-delete-btn:hover{border-color:#B4433A;color:#B4433A}

    /* ---- GLOSARIO ---- */
    .glossary-search-wrap{padding:10px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
    .glossary-search{width:100%;padding:7px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:var(--sans);outline:none;background:#fff}
    .glossary-search:focus{border-color:var(--accent)}
    .glossary-item{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:background .1s}
    .glossary-item:hover{background:var(--accent-soft)}
    .glossary-term{font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px}
    .glossary-level-tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em}
    .lvl-simple{background:#E6F4F1;color:#2A7A6B}
    .lvl-intermedio{background:#EEF0FB;color:#4051B5}
    .lvl-tecnico{background:#FDF0F0;color:#B4433A}
    .glossary-def{font-size:12px;color:var(--ink-soft);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .glossary-page{font-size:10.5px;color:var(--ink-soft)}
    .glossary-actions{display:flex;gap:6px;margin-top:4px}
    .glossary-del{background:none;border:none;color:var(--ink-soft);font-size:11px;cursor:pointer;padding:0;text-decoration:underline}
    .glossary-del:hover{color:var(--danger)}

    /* ---- CHAT ---- */
    .chat-panel{display:flex;flex-direction:column;height:100%}
    .thread-bar{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line);flex-shrink:0}
    .thread-bar select{flex:1;font-size:12px;font-family:var(--sans);border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#fff;color:var(--ink);cursor:pointer;outline:none;min-width:0}
    .thread-btn{background:none;border:1px solid var(--line);color:var(--ink-soft);width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .thread-btn:hover{background:var(--accent-soft);border-color:var(--accent)}
    .thread-btn.danger:hover{background:rgba(180,67,58,.1);border-color:#B4433A;color:#B4433A}
    .chat-header-bar{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
    .chat-header-bar span{font-size:12px;color:var(--ink-soft)}
    .chat-action-btn{background:none;border:none;color:var(--ink-soft);font-size:11px;cursor:pointer;text-decoration:underline}
    .chat-action-btn.danger:hover{color:#B4433A}
    .chat-key-setup{padding:22px 18px;font-size:13px;color:var(--ink-soft);line-height:1.65}
    .chat-key-setup strong{color:var(--ink)}
    .chat-key-setup a{color:var(--accent)}
    .chat-key-input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);font-size:13px;font-family:var(--sans);margin:12px 0 10px;outline:none}
    .chat-key-input:focus{border-color:var(--accent)}
    .chat-messages{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px}
    .chat-msg{font-size:13px;line-height:1.55;padding:9px 13px;border-radius:12px;max-width:93%;white-space:pre-wrap;word-break:break-word}
    .chat-cite-block{background:rgba(255,255,255,0.2);color:#fff;padding:6px 10px;border-radius:8px;font-size:11px;font-style:italic;margin-bottom:8px;border-left:3px solid rgba(255,255,255,0.5);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis}
    .chat-msg-wrap{display:flex;flex-direction:column;gap:3px;max-width:93%}
    .chat-msg-wrap.user{align-self:flex-end;align-items:flex-end}
    .chat-msg-wrap.model{align-self:flex-start;align-items:flex-start}
    .chat-msg-wrap.user .chat-msg{background:var(--accent);color:#fff;border-radius:12px 12px 3px 12px}
    .chat-msg-wrap.model .chat-msg{background:#fff;border:1px solid var(--line);border-radius:12px 12px 12px 3px}
    .chat-msg-wrap .chat-msg.pending{color:var(--ink-soft);font-style:italic;background:#fff;border:1px solid var(--line)}
    .chat-msg-actions{display:none;gap:4px}
    .chat-msg-wrap:hover .chat-msg-actions{display:flex}
    .cm-act{background:none;border:1px solid var(--line);color:var(--ink-soft);font-size:10px;padding:3px 7px;border-radius:5px;cursor:pointer;transition:all .12s}
    .cm-act:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
    .cm-act.del:hover{border-color:#B4433A;color:#B4433A;background:rgba(180,67,58,.07)}
    .chat-edit-area{width:100%;resize:none;border:1px solid var(--accent);border-radius:10px;padding:8px 11px;font-family:var(--sans);font-size:13px;min-height:60px;outline:none;line-height:1.4;color:var(--ink);background:#fff}
    .chat-edit-actions{display:flex;gap:6px;margin-top:4px}
    .chat-edit-save{background:var(--accent);color:#fff;border:none;padding:5px 14px;border-radius:7px;font-size:12px;cursor:pointer}
    .chat-edit-cancel{background:none;border:1px solid var(--line);color:var(--ink-soft);padding:5px 10px;border-radius:7px;font-size:12px;cursor:pointer}
    .chat-empty{padding:22px 18px;font-size:13px;color:var(--ink-soft);line-height:1.65}
    .chat-input-row{display:flex;gap:7px;padding:10px;border-top:1px solid var(--line);flex-shrink:0}
    .chat-textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:var(--r);padding:8px 11px;font-family:var(--sans);font-size:13px;min-height:38px;max-height:100px;outline:none;line-height:1.4}
    .chat-textarea:focus{border-color:var(--accent)}
    .chat-send-btn{background:var(--accent);color:#fff;border:none;border-radius:var(--r);padding:0 14px;cursor:pointer;font-size:13px;align-self:flex-end;height:38px}
    .chat-send-btn:hover{background:var(--accent-h)}
    .chat-send-btn:disabled{opacity:.45;cursor:not-allowed}

    /* ---- PANEL FLOTANTE de explicación ---- */
    .explain-panel{position:fixed;bottom:20px;right:20px;width:430px;max-height:75vh;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 60px rgba(0,0,0,.22);z-index:100;display:flex;flex-direction:column;animation:panelIn .25s ease}
    @keyframes panelIn{from{transform:translateY(30px) scale(.96);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
    .explain-panel-header{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 18px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
    .explain-panel-term{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--ink);font-weight:400;line-height:1.25;flex:1;margin-right:10px}
    .explain-panel-page{font-size:11px;color:var(--ink-soft);margin-top:3px}
    .explain-panel-close{background:none;border:1px solid var(--line);color:var(--ink-soft);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .explain-panel-close:hover{background:var(--accent-soft);color:var(--ink)}
    /* Niveles de explicación */
    .explain-levels-row{display:flex;gap:6px;padding:10px 18px 0;flex-shrink:0}
    .explain-level-btn{flex:1;padding:6px 4px;border-radius:7px;font-size:11.5px;font-weight:600;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);transition:all .15s;font-family:var(--sans);text-align:center}
    .explain-level-btn:hover{border-color:var(--accent);color:var(--accent)}
    .explain-level-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .explain-panel-body{flex:1;overflow-y:auto;padding:14px 18px;font-size:14px;line-height:1.7;color:var(--ink)}
    .explain-panel-body .explain-loading{display:flex;align-items:center;gap:12px;color:var(--ink-soft);font-size:13px;padding:10px 0}
    .explain-panel-body .spinner{width:22px;height:22px;border-width:2px}
    .explain-panel-body .explain-text{white-space:pre-wrap;word-break:break-word}
    .explain-panel-footer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-shrink:0}
    .epf-btn{flex:1;padding:9px 10px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;text-align:center;border:1px solid var(--line);background:#fff;color:var(--ink);transition:all .12s;font-family:var(--sans)}
    .epf-btn:hover{background:var(--accent-soft);border-color:var(--accent)}
    .epf-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .epf-btn.primary:hover{background:var(--accent-h)}
    .epf-btn:disabled{opacity:.4;cursor:not-allowed}

    /* ---- POPUP DE PREGUNTA ---- */
    .ask-popup{position:fixed;bottom:20px;right:20px;width:380px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 60px rgba(0,0,0,.22);z-index:100;display:flex;flex-direction:column;animation:panelIn .2s ease;overflow:hidden}
    .ask-popup-header{padding:12px 16px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-shrink:0}
    .ask-popup-cite{font-size:12px;color:var(--ink-soft);font-style:italic;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .ask-popup-cite strong{color:var(--ink);font-style:normal}
    .ask-popup-close{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:16px;padding:0;line-height:1;flex-shrink:0}
    .ask-popup-close:hover{color:var(--ink)}
    .ask-popup-body{padding:12px 16px;display:flex;gap:8px;align-items:flex-end}
    .ask-popup-input{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-family:var(--sans);font-size:13px;min-height:70px;max-height:140px;outline:none;line-height:1.5;color:var(--ink)}
    .ask-popup-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(63,110,99,.1)}
    .ask-popup-input::placeholder{color:var(--ink-soft)}
    .ask-popup-send{background:var(--accent);color:#fff;border:none;border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .12s}
    .ask-popup-send:hover{background:var(--accent-h)}

    /* ---- BANNER ¿DÓNDE ME QUEDÉ? ---- */
    .resume-banner{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(32,30,27,.7);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .3s ease}
    .resume-banner-card{background:#fff;border-radius:20px;padding:32px 30px;max-width:480px;width:100%;box-shadow:0 24px 72px rgba(0,0,0,.28);position:relative}
    .resume-banner-tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
    .resume-banner-title{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--ink);margin-bottom:14px;line-height:1.3}
    .resume-banner-summary{font-size:14px;line-height:1.7;color:var(--ink-soft);white-space:pre-wrap}
    .resume-banner-page{display:inline-block;margin-top:14px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:5px 12px;font-size:13px;font-weight:600}
    .resume-banner-actions{display:flex;gap:10px;margin-top:20px}
    .resume-banner-continue{flex:1;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;font-family:var(--sans)}
    .resume-banner-continue:hover{background:var(--accent-h)}
    .resume-banner-dismiss{background:none;border:1px solid var(--line);color:var(--ink-soft);padding:12px 18px;border-radius:10px;font-size:14px;cursor:pointer;font-family:var(--sans);transition:all .12s}
    .resume-banner-dismiss:hover{border-color:var(--ink-soft);color:var(--ink)}
    .resume-spinner{display:flex;align-items:center;gap:12px;color:var(--ink-soft);font-size:13px;margin-top:8px}

    /* ---- QUIZ POPUP ---- */
    .quiz-popup{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:420px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 60px rgba(0,0,0,.28);z-index:150;animation:panelIn .25s ease;overflow:hidden}
    .quiz-popup-header{background:linear-gradient(135deg,#201E1B 0%,#3F6E63 100%);padding:16px 18px 14px;color:#fff}
    .quiz-popup-tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:4px}
    .quiz-popup-q{font-size:14px;line-height:1.55}
    .quiz-popup-body{padding:16px 18px}
    .quiz-textarea{width:100%;resize:none;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-family:var(--sans);font-size:13px;min-height:70px;outline:none;line-height:1.5;color:var(--ink)}
    .quiz-textarea:focus{border-color:var(--accent)}
    .quiz-popup-actions{display:flex;gap:8px;padding:0 18px 16px}
    .quiz-submit-btn{flex:1;background:var(--accent);color:#fff;border:none;padding:10px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans)}
    .quiz-submit-btn:hover{background:var(--accent-h)}
    .quiz-skip-btn{background:none;border:1px solid var(--line);color:var(--ink-soft);padding:10px 16px;border-radius:9px;font-size:13px;cursor:pointer;font-family:var(--sans)}
    .quiz-feedback{padding:14px 18px 18px;font-size:13px;line-height:1.6;color:var(--ink);border-top:1px solid var(--line);background:var(--accent-soft)}
    .quiz-close-btn{display:block;width:100%;background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;padding:10px;font-family:var(--sans)}

    /* ---- CHAPTER PREVIEW BANNER ---- */
    .chapter-preview{position:fixed;top:70px;left:50%;transform:translateX(-50%);width:420px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 44px rgba(0,0,0,.2);z-index:90;animation:panelIn .22s ease;overflow:hidden}
    .chapter-preview-header{background:var(--spine);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
    .chapter-preview-title{color:var(--spine-text);font-size:13px;font-weight:600;opacity:.9}
    .chapter-preview-close{background:none;border:none;color:rgba(255,255,255,.6);cursor:pointer;font-size:16px;padding:0;line-height:1}
    .chapter-preview-close:hover{color:#fff}
    .chapter-preview-body{padding:14px 16px;font-size:13px;line-height:1.65;color:var(--ink-soft)}
    .chapter-preview-chapter{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink);margin-bottom:8px}

    /* ---- TOAST DE LOGRO ---- */
    .achievement-toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--spine);color:#fff;border-radius:999px;padding:12px 24px;font-size:14px;font-weight:600;box-shadow:0 8px 32px rgba(0,0,0,.3);z-index:300;animation:toastIn .35s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;display:flex;align-items:center;gap:10px}
    @keyframes toastIn{from{transform:translateX(-50%) translateY(30px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
    .toast-emoji{font-size:20px}

    /* ---- STREAK PANEL ---- */
    .streak-overlay{position:fixed;inset:0;background:rgba(32,30,27,.6);backdrop-filter:blur(6px);z-index:400;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .2s ease}
    .streak-panel{background:#fff;border-radius:22px;padding:28px;max-width:460px;width:100%;box-shadow:0 24px 80px rgba(0,0,0,.28);position:relative}
    .streak-panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
    .streak-panel-title{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--ink)}
    .streak-panel-close{background:none;border:1px solid var(--line);color:var(--ink-soft);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
    .streak-panel-close:hover{background:var(--accent-soft)}
    .streak-stats-row{display:flex;gap:12px;margin-bottom:22px}
    .streak-stat-box{flex:1;background:var(--sidebar-bg);border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center}
    .streak-stat-num{font-size:28px;font-weight:700;color:var(--accent);line-height:1.1}
    .streak-stat-num.fire{color:#E9B949}
    .streak-stat-label{font-size:11px;color:var(--ink-soft);margin-top:4px;line-height:1.3}
    .streak-cal-label{font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
    .streak-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
    .streak-day{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:600;position:relative;cursor:default}
    .streak-day.read{background:var(--accent);color:#fff}
    .streak-day.today{box-shadow:0 0 0 2px var(--accent)}
    .streak-day.empty{background:var(--line);color:var(--ink-soft)}
    .streak-day-tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--spine);color:#fff;font-size:10px;padding:3px 8px;border-radius:5px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:10}
    .streak-day:hover .streak-day-tip{opacity:1}
    .streak-badge-btn{cursor:pointer;user-select:none}
    .streak-badge-btn:hover{opacity:.8}

    /* ---- VISUAL MODE ---- */
    .visual-badge{position:absolute;top:10px;right:10px;background:rgba(124,178,217,.18);border:1.5px solid rgba(124,178,217,.5);color:#4A82A6;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;z-index:25;cursor:pointer;transition:background .15s;backdrop-filter:blur(4px)}
    .visual-badge:hover{background:rgba(124,178,217,.32)}
    .crop-overlay{position:absolute;inset:0;z-index:28;cursor:crosshair}
    .crop-overlay.active{}
    .crop-rect{position:absolute;border:2px dashed var(--accent);background:rgba(63,110,99,.12);border-radius:3px;pointer-events:none;z-index:29}
    .crop-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(32,30,27,.82);color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;pointer-events:none;white-space:nowrap;z-index:30}
    body.visual-mode .page-wrap{outline:2px dashed rgba(124,178,217,.6);outline-offset:4px}
    body.visual-mode .textLayer{pointer-events:none !important}
    .spine-btn.visual-active{background:rgba(124,178,217,.25) !important;border-color:rgba(124,178,217,.6) !important;color:#7CB2D9 !important}

    /* ---- MODAL EDICIÓN LIBRO ---- */
    .modal-overlay{position:fixed;inset:0;background:rgba(32,30,27,.6);backdrop-filter:blur(6px);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease}
    .modal-card{background:#fff;border-radius:18px;padding:28px;max-width:400px;width:100%;box-shadow:0 24px 72px rgba(0,0,0,.28)}
    .modal-title{font-size:17px;font-weight:700;margin-bottom:18px}
    .modal-field{margin-bottom:14px}
    .modal-field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
    .modal-field input,.modal-field select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);font-size:14px;font-family:var(--sans);outline:none;transition:border-color .15s;background:#fff}
    .modal-field input:focus,.modal-field select:focus{border-color:var(--accent)}
    .modal-actions{display:flex;gap:10px;margin-top:20px}
    .modal-save{flex:1;background:var(--accent);color:#fff;border:none;padding:11px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans)}
    .modal-save:hover{background:var(--accent-h)}
    .modal-cancel{background:none;border:1px solid var(--line);color:var(--ink-soft);padding:11px 16px;border-radius:10px;font-size:14px;cursor:pointer;font-family:var(--sans)}

    /* ============================================================
       MOBILE
       ============================================================ */
    @media(max-width:640px){
      input,textarea,select{font-size:16px !important}
      .spine{padding:8px 10px;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
      .spine::-webkit-scrollbar{display:none}
      .spine-sep{display:none !important}
      .page-total{display:none}
      .spine-btn{padding:8px 12px;min-height:38px}
      .stage{padding:16px 6px 120px}
      .margin-strip{display:none}
      .library-wrap{padding:24px 16px 40px}
      .library-header{flex-direction:column;gap:14px}
      .doc-grid{grid-template-columns:1fr}
      .sidebar{
        position:fixed !important;
        left:0 !important;right:0 !important;bottom:0 !important;
        width:100% !important;
        max-height:78vh;
        border-left:none !important;
        border-top:1px solid var(--line);
        border-radius:20px 20px 0 0;
        box-shadow:0 -10px 44px rgba(0,0,0,.22);
        z-index:50;
        display:flex !important;
        transform:translateY(0);
        transition:transform .32s cubic-bezier(.32,.72,0,1);
      }
      .sidebar.hidden{transform:translateY(110%);pointer-events:none;visibility:hidden}
      .selection-toolbar{padding:10px 16px;gap:10px}
      .selection-toolbar .swatch-dot{width:28px;height:28px}
      .explain-btn{padding:8px 16px;font-size:13px;min-height:36px}
      .explain-panel{left:0 !important;right:0 !important;bottom:0 !important;width:100% !important;border-radius:20px 20px 0 0 !important;max-height:68vh}
      .ask-popup{left:0 !important;right:0 !important;bottom:0 !important;width:100% !important;border-radius:20px 20px 0 0 !important}
      .quiz-popup{left:12px !important;right:12px !important;transform:none !important;width:auto !important;bottom:16px}
      .chapter-preview{left:12px !important;right:12px !important;transform:none !important;width:auto !important}
      .chat-msg-actions{display:flex !important}
      .streak-badge{display:none}
    }

    .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:49;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fadeIn .22s ease}
    .sidebar-backdrop.visible{display:block}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .sidebar-handle{display:none;flex-shrink:0;width:36px;height:4px;background:var(--line);border-radius:2px;margin:10px auto 0}
    @media(max-width:640px){.sidebar-handle{display:block}}
    .sidebar-close-btn{display:none;margin-left:auto;background:none;border:none;color:var(--ink-soft);font-size:18px;padding:8px 10px;cursor:pointer;flex-shrink:0}
    @media(max-width:640px){.sidebar-close-btn{display:block}}

    /* ---- Glosario → Tarjeta ---- */
    .glossary-add-card{background:none;border:1px solid var(--line);color:var(--ink-soft);font-size:11px;padding:3px 8px;border-radius:6px;cursor:pointer;transition:all .12s;font-family:var(--sans)}
    .glossary-add-card:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
    .glossary-add-card:disabled{opacity:.5;cursor:default}

    /* ---- Flashcard header / form / rename ---- */
    .fc-tab-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 4px;border-bottom:1px solid var(--line);margin-bottom:12px}
    .fc-tab-title{font-size:13px;font-weight:600;color:var(--ink)}
    .fc-new-btn{background:var(--accent);color:#fff;border:none;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s}
    .fc-new-btn:hover{background:var(--accent-h)}
    .fc-new-form{padding:16px;display:flex;flex-direction:column;gap:10px}
    .fc-new-form label{font-size:11.5px;font-weight:500;color:var(--ink-soft);margin-bottom:2px;display:block}
    .fc-new-form input,.fc-new-form textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);font-size:13px;font-family:var(--sans);outline:none;resize:vertical;transition:border-color .15s}
    .fc-new-form input:focus,.fc-new-form textarea:focus{border-color:var(--accent)}
    .fc-new-form-actions{display:flex;gap:8px;margin-top:4px}
    .fc-new-save{background:var(--accent);color:#fff;border:none;padding:9px 18px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;flex:1;transition:background .15s}
    .fc-new-save:hover{background:var(--accent-h)}
    .fc-new-cancel{background:none;border:1px solid var(--line);color:var(--ink-soft);padding:9px 14px;border-radius:var(--r);font-size:13px;cursor:pointer;transition:all .12s}
    .fc-new-cancel:hover{border-color:var(--danger);color:var(--danger)}
    .fc-card-actions{display:flex;gap:8px;justify-content:center;margin-top:4px}
    .fc-rename-btn{background:none;border:1px solid var(--line);color:var(--ink-soft);font-size:11.5px;padding:5px 12px;border-radius:7px;cursor:pointer;transition:all .12s;font-family:var(--sans)}

1. Ve directo a la base lógica: qué es lo mínimo que hace que esto tenga sentido, antes que la descripción general.
2. Evita metáforas espaciales o decorativas ("como un puente entre...", "imagina un mundo donde..."). Si necesitas comparar algo, usa una acción o consecuencia concreta, no una imagen visual/espacial.

function cleanSelectedText(raw, pageNum) {
  let t = raw.replace(/\s+/g, ' ').trim();
  t = t.replace(/^[.\s]+/, '').replace(/[.\s]+$/, '');
  if (t.length < 20 && state.searchIndex.length > 0) {
    const pageData = state.searchIndex.find(p => p.page === pageNum);
    if (pageData) {
      const idx = pageData.text.toLowerCase().indexOf(t.toLowerCase());
      if (idx !== -1) {
        let start = idx, end = idx + t.length;
        while (start > 0 && /\S/.test(pageData.text[start - 1])) start--;
        while (end < pageData.text.length && /\S/.test(pageData.text[end])) end++;
        t = pageData.text.slice(start, end).trim();
      }
    }
  }
  return t;
}

// ============================================================
// Library
// ============================================================
async function loadDocuments() {
  const { data } = await state.sb.from('documents').select('*').order('created_at', { ascending: false });
  state.documents = data || [];
  // Cargar progreso de lectura de todos los docs
  if (state.documents.length > 0) {
    const ids = state.documents.map(d => d.id);
    const { data: progs } = await state.sb.from('reading_progress').select('document_id,page,updated_at').in('document_id', ids);
    state.docProgresses = {};
    (progs || []).forEach(p => { state.docProgresses[p.document_id] = { page: p.page, updated_at: p.updated_at }; });

    // Calcular rachas
    const allDates = (progs || [])
      .map(p => p.updated_at ? new Date(p.updated_at) : null)
      .filter(Boolean);
    // Días únicos (cadena YYYY-MM-DD)
    const uniqueDateStrings = [...new Set(allDates.map(d => d.toDateString()))].sort();
    state.streakDates = uniqueDateStrings.map(s => new Date(s));
    state.totalDaysRead = uniqueDateStrings.length;

    // Racha actual (días consecutivos hacia atrás desde hoy)
    const today = new Date();
    let streak = 0;
    for (let i = 0; i < 365; i++) {
      const d = new Date(today); d.setDate(today.getDate() - i);
      if (uniqueDateStrings.includes(d.toDateString())) streak++;
      else break;
    }
    state.readingStreak = streak;

    // Mejor racha histórica
    let best = 0, cur = 1;
    for (let i = 1; i < uniqueDateStrings.length; i++) {
      const prev = new Date(uniqueDateStrings[i - 1]);
      const curr = new Date(uniqueDateStrings[i]);
      const diff = (curr - prev) / (1000 * 60 * 60 * 24);
      if (diff === 1) { cur++; if (cur > best) best = cur; }
      else cur = 1;
    }
    if (uniqueDateStrings.length > 0) best = Math.max(best, cur, 1);
    state.bestStreak = best;
  }
}

// ============================================================
// Streak Panel
// ============================================================
function showStreakPanel() {
  document.getElementById('streak-overlay')?.remove();
  const DAYS = 35; // 5 semanas
  const today = new Date();
  today.setHours(0,0,0,0);
  const readSet = new Set(state.streakDates.map(d => { const x = new Date(d); x.setHours(0,0,0,0); return x.toDateString(); }));

  // Construir array de los últimos DAYS días comenzando en lunes de la semana más vieja
  const startDay = new Date(today);
  startDay.setDate(today.getDate() - DAYS + 1);
  // Retroceder al lunes previo para alinear el grid
  const dow = startDay.getDay(); // 0=dom
  const offset = (dow === 0) ? 6 : dow - 1;
  startDay.setDate(startDay.getDate() - offset);

  const days = [];
  for (let i = 0; i < DAYS + offset; i++) {
    const d = new Date(startDay);
    d.setDate(startDay.getDate() + i);
    if (d > today) break;
    days.push(d);
  }

  const dayNames = ['L','M','X','J','V','S','D'];
  const calHTML = `
    <div class="streak-cal">
      ${dayNames.map(n => `<div style="font-size:9px;font-weight:700;color:var(--ink-soft);text-align:center;padding-bottom:2px">${n}</div>`).join('')}
      ${days.map(d => {
        const isRead = readSet.has(d.toDateString());
        const isToday = d.toDateString() === today.toDateString();
        const label = d.toLocaleDateString('es', {day:'numeric', month:'short'});
        return `<div class="streak-day ${isRead?'read':'empty'} ${isToday?'today':''}">
          ${d.getDate()}
          <span class="streak-day-tip">${label}${isRead?' ✔':''}</span>
        </div>`;
      }).join('')}
    </div>`;

  const overlay = document.createElement('div');
  overlay.id = 'streak-overlay'; overlay.className = 'streak-overlay';
  overlay.innerHTML = `
    <div class="streak-panel" id="streak-panel">
      <div class="streak-panel-header">
        <div class="streak-panel-title">🔥 Racha de lectura</div>
        <button class="streak-panel-close" id="sp-close">✕</button>
      </div>
      <div class="streak-stats-row">
        <div class="streak-stat-box">
          <div class="streak-stat-num fire">${state.readingStreak}</div>
          <div class="streak-stat-label">Días seguidos<br>ahora</div>
        </div>
        <div class="streak-stat-box">
          <div class="streak-stat-num">${state.bestStreak}</div>
          <div class="streak-stat-label">Mejor racha<br>histórica</div>
        </div>
        <div class="streak-stat-box">
          <div class="streak-stat-num">${state.totalDaysRead}</div>
          <div class="streak-stat-label">Total días<br>leídos</div>
        </div>
      </div>
      <div class="streak-cal-label">Últimas 5 semanas</div>
      ${calHTML}
    </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = e => { if (!document.getElementById('streak-panel').contains(e.target)) overlay.remove(); };
  document.getElementById('sp-close').onclick = () => overlay.remove();
}

function renderDocCard(d) {
  const prog = state.docProgresses[d.id];
  const page = prog?.page || 1;
  const total = d.num_pages || 1;
  const pct = Math.round((page / total) * 100);
  const cat = d.category || 'Sin categoría';

async function deleteDocument(docId) {
  const doc = state.documents.find(d => d.id === docId);
  if (!doc) return;
  if (!confirm(`¿Eliminar "${doc.title}"?\n\nEsto borrará el PDF, todos los subrayados y el historial de chat. Esta acción no se puede deshacer.`)) return;
  renderLoading('Eliminando…');
  try {
    await state.sb.storage.from('pdfs').remove([doc.storage_path]);
    await state.sb.from('highlights').delete().eq('document_id', docId);
    await state.sb.from('reading_progress').delete().eq('document_id', docId);
    await state.sb.from('chat_messages').delete().eq('document_id', docId);
    await state.sb.from('chat_threads').delete().eq('document_id', docId);
    await state.sb.from('flashcards').delete().eq('document_id', docId);
    try { await state.sb.from('glossary').delete().eq('document_id', docId); } catch(_) {}
    await state.sb.from('documents').delete().eq('id', docId);
    state.documents = state.documents.filter(d => d.id !== docId);
    delete state.docProgresses[docId];
    renderLibrary();
  } catch(err) { alert('Error al eliminar: ' + err.message); renderLibrary(); }
}

async function onUpload(e) {
  const files = Array.from(e.target.files); if (!files.length) return;
  const prog = document.getElementById('upload-progress'); prog.style.display = 'block';
  for (let i = 0; i < files.length; i++) {
    const f = files[i]; prog.textContent = `Subiendo ${i+1}/${files.length}: ${f.name}…`;
    const path = `${state.session.user.id}/${Date.now()}_${f.name}`;
    const { error } = await state.sb.storage.from('pdfs').upload(path, f);
    if (error) { alert('Error: ' + error.message); continue; }
    const buf = await f.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    await state.sb.from('documents').insert({ title: f.name.replace(/\.pdf$/i,''), storage_path: path, num_pages: pdf.numPages, user_id: state.session.user.id, category: 'Sin categoría' });
  }
  prog.style.display = 'none'; await loadDocuments(); renderLibrary();
}

async function openDocument(docId) {
  renderLoading('Abriendo documento…');
  const doc = state.documents.find(d => d.id === docId);
  if (!doc) { state.view = 'library'; render(); return; }
  state.currentDoc = doc;
  try {
    const { data: fd, error: dlE } = await state.sb.storage.from('pdfs').download(doc.storage_path);
    if (dlE) throw dlE;
    state.pdf = await pdfjsLib.getDocument({ data: await fd.arrayBuffer() }).promise;
    state.numPages = state.pdf.numPages;

    const { data: prog } = await state.sb.from('reading_progress').select('page').eq('document_id', docId).maybeSingle();
    const savedPage = prog?.page || 1;
    state.pageNum = savedPage;

    const { data: hls } = await state.sb.from('highlights').select('*').eq('document_id', docId);
    state.highlights = (hls||[]).map(h => ({ id:h.id, page:h.page, rects:h.rects, color:h.color, text:h.text, note:h.note||'' }));

    // Threads
    let threadsError = null;
    let { data: threads, error: tErr } = await state.sb.from('chat_threads').select('*').eq('document_id', docId).order('created_at');
    threadsError = tErr;
    if (threads && threads.length > 0) {
      state.chatThreads = threads; state.currentThreadId = threads[0].id;
    } else {
      const { data: nt, error: ntErr } = await state.sb.from('chat_threads').insert({ document_id: docId, title: 'Chat General', user_id: state.session.user.id }).select().single();
      if (ntErr) threadsError = ntErr;
      if (nt) {
        state.chatThreads = [nt]; state.currentThreadId = nt.id;
        await state.sb.from('chat_messages').update({ thread_id: nt.id }).eq('document_id', docId).is('thread_id', null);
      } else { state.chatThreads = []; state.currentThreadId = null; }
    }
    if (threadsError) {
      console.warn("Supabase chat_threads warning:", threadsError);
      alert("Aviso de Base de Datos (Chats):\n" + threadsError.message + "\n\n¿Ejecutaste el SQL de migración en Supabase?");
    }
    await loadThreadMsgs(state.currentThreadId);

    state.tocEntries = (await state.pdf.getOutline()) || [];

    try {
      const { data: fcs } = await state.sb.from('flashcards').select('*').eq('document_id', docId).order('created_at');
      state.flashcards = fcs || [];
    } catch (_) { state.flashcards = []; }
    state.flashcardIdx = 0;

    // Glossary
    try {
      const { data: gl } = await state.sb.from('glossary').select('*').eq('document_id', docId).order('created_at', { ascending: false });
      state.glossary = gl || [];
    } catch(_) { state.glossary = []; }

    state.searchQuery=''; state.searchResults=[]; state.searchResultIdx=-1; state.searchBarOpen=false; state.searchIndex=[];
    state.explainVisible=false; state.explainText=''; state.explainTerm='';
    state.quizLastPage = savedPage;
    state.glossaryFilter = '';

    renderLoading('Indexando texto…');
    state.docFullText = await extractFullText(state.pdf);
    state.view = 'reader'; renderReaderShell();

    // Mostrar banner "¿Dónde me quedé?" si estamos en página > 3
    if (savedPage > 3 && state.geminiKey) {
      showResumeBanner(doc, savedPage);
    }
  } catch (err) { alert('Error: ' + err.message); state.view = 'library'; render(); }
}

async function loadThreadMsgs(threadId) {
  if (!threadId) { state.chatMessages = []; return; }
  const { data } = await state.sb.from('chat_messages').select('id,role,content,created_at').eq('thread_id', threadId).order('created_at');
  state.chatMessages = (data||[]).map(m => ({ id: m.id, created_at: m.created_at, role: m.role, text: m.content }));
}

async function extractFullText(pdf) {
  const MAX = 400_000; let out = ''; state.searchIndex = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const p = await pdf.getPage(i); const c = await p.getTextContent();
    const t = c.items.map(it => it.str).join(' ');
    state.searchIndex.push({ page: i, text: t });
    out += `\n\n[Página ${i}]\n${t}`;
    if (out.length > MAX) { out = out.slice(0, MAX) + '\n[…truncado…]'; break; }
  }
  return out;
}

async function showResumeBanner(doc, page) {
  const overlay = document.createElement('div');
  overlay.className = 'resume-banner';
  overlay.id = 'resume-banner';
  overlay.innerHTML = `
    <div class="resume-banner-card">
      <div class="resume-banner-tag">¿Dónde me quedé?</div>
      <div class="resume-banner-title">${esc(doc.title)}</div>
      <div class="resume-spinner"><div class="spinner" style="width:20px;height:20px;border-width:2px"></div><span style="font-size:13px;color:var(--ink-soft)">Generando resumen…</span></div>
      <div class="resume-banner-actions">
        <button class="resume-banner-dismiss" id="rb-dismiss">Ver sin resumen</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('rb-dismiss').onclick = () => overlay.remove();

  // Obtener contexto de las últimas páginas
  const fromPage = Math.max(1, page - 5);
  const pagesCtx = state.searchIndex.filter(p => p.page >= fromPage && p.page <= page).map(p => `[Pág. ${p.page}] ${p.text.slice(0, 500)}`).join('\n\n');

  const prompt = `El usuario estaba leyendo "${doc.title}" y lo dejó en la página ${page} de ${state.numPages}.

Aquí está el texto de las últimas páginas leídas:
${pagesCtx}

${STYLE_BLOCK}

En 2-3 líneas, recuérdale de qué trataba el libro en esas páginas, priorizando la idea que conecta lo leído (la causa o el hilo lógico), no solo un resumen de eventos. Responde en español, sin títulos ni bullets, un párrafo directo.`;

  try {
    const r = await fetch(`${GEMINI_API}?key=${state.geminiKey}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ contents: [{ role:'user', parts:[{ text: prompt }] }] })
    });
    const d = await r.json();
    const summary = d.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || null;
    const card = overlay.querySelector('.resume-banner-card');
    if (card && summary) {
      card.innerHTML = `
        <div class="resume-banner-tag">¿Dónde me quedé?</div>
        <div class="resume-banner-title">${esc(doc.title)}</div>
        <div class="resume-banner-summary">${esc(summary)}</div>
        <div class="resume-banner-page">📖 Retomar en página ${page}</div>
        <div class="resume-banner-actions">
          <button class="resume-banner-continue" id="rb-continue">Continuar leyendo →</button>
          <button class="resume-banner-dismiss" id="rb-dismiss2">Ir al inicio</button>
        </div>`;
      document.getElementById('rb-continue').onclick = () => overlay.remove();
      document.getElementById('rb-dismiss2').onclick = () => { goToPage(1); overlay.remove(); };
    } else {
      overlay.remove();
    }
  } catch(_) { overlay.remove(); }
}

function toggleSearchBar() {

  const r=document.getElementById('search-bar-row'); if(!r) return;
  r.classList.toggle('hidden',!state.searchBarOpen);
  if(state.searchBarOpen){renderSearchBar();setTimeout(()=>document.getElementById('si')?.focus(),40)}
  else{state.searchResults=[];state.searchQuery='';renderSRP()}
}
function renderSearchBar() {
  const r=document.getElementById('search-bar-row');if(!r)return;
  const c=state.searchResults.length,i=state.searchResultIdx;
  r.innerHTML=`<input class="search-input" id="si" placeholder="Buscar…" value="${esc(state.searchQuery)}">
    <span class="search-count">${c>0?`${i+1}/${c}`:(state.searchQuery?'Sin resultados':'')}</span>
    <button class="search-nav-btn" id="sp" ${c===0?'disabled':''}>‹</button>
    <button class="search-nav-btn" id="sn" ${c===0?'disabled':''}>›</button>`;
  let deb;
  document.getElementById('si').oninput=e=>{state.searchQuery=e.target.value;clearTimeout(deb);deb=setTimeout(()=>{doSearch(state.searchQuery);renderSearchBar();renderSRP()},260)};
  document.getElementById('si').onkeydown=e=>{if(e.key==='Escape'){state.searchBarOpen=false;toggleSearchBar()}if(e.key==='Enter')navSearch(e.shiftKey?-1:1)};
  document.getElementById('sp').onclick=()=>navSearch(-1);
  document.getElementById('sn').onclick=()=>navSearch(1);
}
function doSearch(q){
  q=q.trim().toLowerCase();if(!q){state.searchResults=[];state.searchResultIdx=-1;return}
  const res=[];
  for(const{page,text}of state.searchIndex){const lc=text.toLowerCase();let p=0,m=0;while(m<3){const i=lc.indexOf(q,p);if(i===-1)break;
    const s=Math.max(0,i-40),e=Math.min(text.length,i+q.length+60);
    res.push({page,snippet:`${s>0?'…':''}${esc(text.slice(s,i))}<em>${esc(text.slice(i,i+q.length))}</em>${esc(text.slice(i+q.length,e))}${e<text.length?'…':''}`});
    p=i+q.length;m++}}
  state.searchResults=res;state.searchResultIdx=res.length>0?0:-1;
  if(res.length>0)goToPage(res[0].page);
}
function navSearch(dir){
  if(!state.searchResults.length)return;
  state.searchResultIdx=(state.searchResultIdx+dir+state.searchResults.length)%state.searchResults.length;
  goToPage(state.searchResults[state.searchResultIdx].page);
  renderSearchBar();renderSRP();
}
function renderSRP(){
  const panel=document.getElementById('search-results-panel');if(!panel)return;
  if(!state.searchResults.length||!state.searchQuery){panel.innerHTML='';return}
  panel.innerHTML=`<div class="search-results-panel">${state.searchResults.slice(0,30).map((r,i)=>`<div class="srp-item ${i===state.searchResultIdx?'active':''}" data-idx="${i}"><span class="srp-page">p.${r.page}</span><span class="srp-snippet">${r.snippet}</span></div>`).join('')}</div>`;
  panel.querySelectorAll('.srp-item').forEach(el=>{el.onclick=()=>{state.searchResultIdx=parseInt(el.dataset.idx);goToPage(state.searchResults[state.searchResultIdx].page);renderSearchBar();renderSRP()}});

// ---- TOC ----
function renderTocTab() {
  const b = document.getElementById('sb-body'); if (!b) return;
  if (!state.tocEntries.length) { b.innerHTML = '<div class="empty-sidebar">Este PDF no tiene índice.</div>'; return; }
  async function resolvePageNum(dest) {
    if (!dest) return null;
    if (Array.isArray(dest) && dest[0]) {
      try { return (await state.pdf.getPageIndex(dest[0])) + 1; } catch(_) {}
    }
    if (typeof dest === 'string') {
      try { const d = await state.pdf.getDestination(dest); if (d) return (await state.pdf.getPageIndex(d[0])) + 1; } catch(_) {}
    }
    return null;
  }
  function flattenToc(items, depth) {
    let out = [];
    for (const item of items) {
      out.push({ title: item.title, dest: item.dest || item.url, depth, items: item.items || [] });
      if (item.items && item.items.length) out = out.concat(flattenToc(item.items, depth + 1));
    }
    return out;
  }
  const flat = flattenToc(state.tocEntries, 0);
  b.innerHTML = flat.map((e, i) => `<div class="toc-entry d${Math.min(e.depth,2)}" data-i="${i}" style="padding-left:${14 + e.depth*14}px">${esc(e.title)}</div>`).join('');
  b.querySelectorAll('.toc-entry').forEach(el => el.onclick = async () => {
    const item = flat[parseInt(el.dataset.i)];
    const pn = await resolvePageNum(item.dest);
    if (pn) goToPage(pn);
  });
}

function parseChatMsg(text) {
  if (text.startsWith('> "')) {
    const parts = text.split('"\n\n');
    if (parts.length >= 2) {
      const cite = parts[0].substring(3);
      const q = parts.slice(1).join('"\n\n');
      return `<div class="chat-cite-block" data-cite="${esc(cite)}">"${esc(cite)}"</div>${esc(q)}`;
    }
  }
  return esc(text);
}

async function sendChat(text){
  let promptText = text, uiText = text;
  if (state.chatCitation) {
    promptText = `[El usuario hace esta pregunta con respecto a la siguiente cita del documento: "${state.chatCitation}"]\n\nPregunta: ${text}`;
    uiText = `> "${state.chatCitation}"\n\n${text}`;
    state.chatCitation = '';
  }
  state.chatMessages.push({role:'user',text:uiText});state.chatBusy=true;renderChatTab();
  const reply=await askGemini(promptText);
  state.chatBusy=false;state.chatMessages.push({role:'model',text:reply});
  renderChatTab();
  const { data, error } = await state.sb.from('chat_messages').insert([
    {document_id:state.currentDoc.id,thread_id:state.currentThreadId,role:'user',content:uiText,user_id:state.session.user.id},
    {document_id:state.currentDoc.id,thread_id:state.currentThreadId,role:'model',content:reply,user_id:state.session.user.id},
  ]).select();
  if (data && data.length >= 2) {
    state.chatMessages[state.chatMessages.length - 2].id = data[0].id;
    state.chatMessages[state.chatMessages.length - 2].created_at = data[0].created_at;
    state.chatMessages[state.chatMessages.length - 1].id = data[1].id;
    state.chatMessages[state.chatMessages.length - 1].created_at = data[1].created_at;
    renderChatTab();
  }
  if (error) { console.error("Error saving chat:", error); alert("Error al guardar mensajes de chat:\n" + error.message); }
}

async function deleteChatMessage(idx) {
  if (!confirm('¿Eliminar este mensaje?')) return;
  const msg = state.chatMessages[idx];
  if (msg?.id) await state.sb.from('chat_messages').delete().eq('id', msg.id);
  state.chatMessages.splice(idx, 1);
  renderChatTab();
}

function startEditMessage(idx) {
  const msg = state.chatMessages[idx];
  if (!msg || msg.role !== 'user') return;
  const wrap = document.querySelector(`.chat-msg-wrap[data-idx="${idx}"]`);
  if (!wrap) return;
  let citation = '', rawText = msg.text;
  if (msg.text.startsWith('> "')) {
    const sepIdx = msg.text.indexOf('"\n\n');
    if (sepIdx !== -1) { citation = msg.text.slice(3, sepIdx); rawText = msg.text.slice(sepIdx + 3); }
  }
  wrap.innerHTML = `
    ${citation ? `<div class="chat-cite-block">"${esc(citation)}"</div>` : ''}
    <textarea class="chat-edit-area" id="edit-ta">${esc(rawText)}</textarea>
    <div class="chat-edit-actions">
      <button class="chat-edit-save" id="edit-save">Guardar y reenviar</button>
      <button class="chat-edit-cancel" id="edit-cancel">Cancelar</button>
    </div>`;
  const ta = document.getElementById('edit-ta');
  ta.focus(); ta.selectionStart = ta.selectionEnd = ta.value.length;
  document.getElementById('edit-cancel').onclick = () => renderChatTab();
  document.getElementById('edit-save').onclick = async () => {
    const newText = ta.value.trim(); if (!newText) return;
    const toDelete = state.chatMessages.slice(idx).map(m => m.id).filter(Boolean);
    if (toDelete.length > 0) await state.sb.from('chat_messages').delete().in('id', toDelete);
    state.chatMessages = state.chatMessages.slice(0, idx);
    if (citation) state.chatCitation = citation;
    sendChat(newText);
  };
}

async function askGemini(userText){
  const sys=`Eres un asistente de lectura dentro de Readily. El usuario lee "${state.currentDoc?.title||''}" (p.${state.pageNum}/${state.numPages}).

Texto del documento:
${state.docFullText}

${STYLE_BLOCK}

Reglas adicionales de conversación:
- Responde con la extensión que el tema necesita: ni más larga de lo necesario, ni tan corta que quede incompleta.
- Si el usuario conversa de forma informal o hace una pregunta simple, responde de forma natural y cómoda, sin estructura rígida.
- Si el usuario reformula algo con sus propias palabras y está bien, confírmalo con sus propias palabras, no con las tuyas.
- Si el usuario se equivoca, corrige directo y claro, sin rodeos, y continúa.
- Cuando termines de explicar un concepto, cierra con una versión comprimida (fórmula, regla corta) SOLO si el tema tiene lógica determinista. Si el tema es interpretativo, señala brevemente los caminos o posturas en tensión.
- Cita la página cuando sea relevante.
- Si algo no está en el documento, explícalo con tu conocimiento general.
- Responde siempre en español.`;

  const history = state.chatMessages.slice(-MAX_CTX).map(m => ({
    role: m.role === 'user' ? 'user' : 'model',
    parts: [{ text: m.text }]
  }));
  if (history.length > 0 && history[history.length - 1].role === 'user') {
    history[history.length - 1].parts[0].text = userText;
  }
  try{
    const r=await fetch(`${GEMINI_API}?key=${state.geminiKey}`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ systemInstruction:{parts:[{text:sys}]}, contents: history })
    });
    const d=await r.json();if(d.error)return`Error: ${d.error.message}`;
    return d.candidates?.[0]?.content?.parts?.map(p=>p.text).join('')||'Sin respuesta.';
  }catch(e){return`Error de conexión: ${e.message}`}
}

    <div class="explain-panel-body" id="ep-body">

        : `<div class="explain-text">${esc(state.explainText)}</div>`}
    </div>
    ${!isLoading && state.explainText ? `
    <div class="explain-panel-footer">
      <button class="epf-btn" id="ep-chat">💬 Seguir en chat</button>

    };
    document.getElementById('ep-fc').onclick = async () => {

          const lid = uid();
          state.highlights.push({ id: lid, page: state.explainPage, rects: fakeRect, color: '#7CB2D9', text: visualText, note: '' });
          const { data, error } = await state.sb.from('highlights').insert({

          }).select().single();
          if (error) throw error;

        }

  }
}

async function triggerExplain(term, pageNum, level) {
  level = level || state.explainLevel;
  state.explainTerm = term;
  state.explainPage = pageNum;
  state.explainText = '';
  state.explainLoading = true;
  state.explainVisible = true;
  state.explainLevel = level;
  state.explainIsVisual = false; // siempre texto normal aquí
  renderExplainPanel();

  const pd = state.searchIndex.find(p => p.page === pageNum);
  const pt = pd?.text || '';
  const tl = term.toLowerCase(), pl = pt.toLowerCase();
  const ti = pl.indexOf(tl);
  let ctx = pt;
  if (ti !== -1) { const s = Math.max(0, ti - 300), e = Math.min(pt.length, ti + term.length + 400); ctx = pt.slice(s, e); }
  else ctx = pt.slice(0, 800);

  const levelInstructions = {
    simple: 'Explícalo como si se lo explicaras a un niño de 12 años. Usa palabras cotidianas, evita términos técnicos y da un ejemplo de la vida real.',
    intermedio: 'Explícalo de forma clara y directa para alguien con conocimiento general. Puedes usar algunos términos del campo pero explícalos brevemente.',
    tecnico: 'Explícalo con precisión técnica y rigor académico. Puedes usar terminología especializada y mencionar matices o sutilezas del concepto.'
  };

  const prompt = `Explica "${term}" en el contexto de la lectura "${state.currentDoc?.title || ''}".

Nivel: ${levelInstructions[level] || levelInstructions.intermedio}

Contexto de la página ${pageNum}:
"${ctx}"

${STYLE_BLOCK}

Instrucciones adicionales:
1. Máximo 3-4 líneas en total.
2. Da la base o regla que hace que el término tenga sentido en 1 oración (no una definición de diccionario suelta).
3. Si aplica, da la consecuencia directa de esa base en 1 oración (qué provoca, qué explica, qué predice) — evita comparaciones espaciales o visuales decorativas.
4. Sin títulos, sin números, sin formato JSON. Responde en español, fluido y directo.`;

  try {
    const r = await fetch(`${GEMINI_API}?key=${state.geminiKey}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }] })
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error.message);
    state.explainText = d.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || 'Sin respuesta.';
  } catch (err) {
    state.explainText = '⚠️ Error: ' + err.message;
  }
  state.explainLoading = false;
  if (state.explainVisible) renderExplainPanel();

  // Guardar en glosario automáticamente
  if (state.explainText && !state.explainText.startsWith('⚠️') && state.currentDoc) {
    const alreadyExists = state.glossary.some(g => g.term.toLowerCase() === term.toLowerCase() && g.level === level);
    if (!alreadyExists) {
      try {
        const { data: gData } = await state.sb.from('glossary').insert({
          document_id: state.currentDoc.id,
          user_id: state.session.user.id,
          term, definition: state.explainText,
          level, page: pageNum
        }).select().single();
        if (gData) state.glossary.unshift(gData);
        if (state.sidebarTab === 'glossary') renderGlossaryTab();
      } catch(_) { /* glossary table may not exist yet */ }
    }
  }
}

async function generateQuizQuestion(recentPages) {
  if (!state.geminiKey) return null;
  const pagesCtx = state.searchIndex
    .filter(p => recentPages.includes(p.page))
    .map(p => `[Pág. ${p.page}] ${p.text.slice(0, 600)}`)
    .join('\n\n');

  // Páginas del historial ANTERIOR a las recientes (para referencias cruzadas)
  const historicalPages = state.readingHistory
    .filter(p => !recentPages.includes(p) && p < Math.min(...recentPages))
    .slice(-5); // Máximo 5 páginas históricas

  let historicalCtx = '';
  if (historicalPages.length >= 2) {
    // Elegir aleatoriamente 2 páginas del historial para evitar repetición
    const sample = historicalPages.sort(() => Math.random() - 0.5).slice(0, 2);
    historicalCtx = state.searchIndex
      .filter(p => sample.includes(p.page))
      .map(p => `[Pág. ${p.page} — leída anteriormente] ${p.text.slice(0, 350)}`)
      .join('\n\n');
  }

  const crossRefInstruction = historicalCtx
    ? `\n\nPáginas leídas anteriormente en la sesión (para referencia cruzada):\n${historicalCtx}\n\nSI existe una conexión clara entre el contenido reciente y el histórico, formula una pregunta que invite al usuario a relacionar ambos (ej: "¿Qué relación tiene X de la página Y con lo que acabas de leer?"). Si no hay conexión obvia, ignora el contexto histórico y haz una pregunta sobre las páginas recientes.`
    : '';

  const prompt = `El usuario acaba de leer las páginas ${recentPages.join(', ')} de "${state.currentDoc?.title || ''}".

Contenido de esas páginas:
${pagesCtx}${crossRefInstruction}

Genera UNA sola pregunta de comprensión que invite a conectar causa y efecto, o base y consecuencia, dentro de lo leído — no una pregunta de solo recordar un dato. Debe ser abierta, no de opción múltiple, y no responderse con una sola palabra.

Responde SOLO con la pregunta, sin numeración ni explicación.`;
  try {
    const r = await fetch(`${GEMINI_API}?key=${state.geminiKey}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ contents: [{ role:'user', parts:[{ text: prompt }] }] })
    });
    const d = await r.json();
    return d.candidates?.[0]?.content?.parts?.map(p => p.text).join('').trim() || null;
  } catch(_) { return null; }
}

    const feedPrompt = `Pregunta: "${question}"\nRespuesta del usuario: "${answer}"\nContexto del libro: "${pagesCtx}"\n\n${STYLE_BLOCK}\n\nDa retroalimentación breve (2-3 oraciones): confirma qué parte de la lógica captó bien (usando, si puedes, algo cercano a sus propias palabras), y si falta algo, señala directamente qué causa o conexión no completó — sin rodeos, sin colchón excesivo de cortesía. Sin negrita. Responde en español.`;
    let feedback = '';
    try {
      const r = await fetch(`${GEMINI_API}?key=${state.geminiKey}`, {

      });

      feedback = d.candidates?.[0]?.content?.parts?.map(p => p.text).join('').trim() || '¡Buen intento!';
    } catch(_) { feedback = '¡Buen intento! Sigue leyendo.'; }
    const popupEl = document.getElementById('quiz-popup');
    if (popupEl) {

      popupEl.querySelector('.quiz-popup-actions')?.remove();
      popupEl.querySelector('.quiz-popup-body')?.remove();
    }

function findChapterAtPage(page) {

  return state.tocEntries[0]?.title || null;

async function maybeShowChapterPreview(page) {
  if (!state.geminiKey || !state.tocEntries.length) return;
  document.getElementById('chapter-preview')?.remove();
  // Detectar si la página actual inicia un capítulo del TOC (heurística simple)
  const pageData = state.searchIndex.find(p => p.page === page);
  if (!pageData) return;
  const text = pageData.text;
  const wordCount = text.split(/\s+/).length;
  // Si la página tiene muy poco texto, probablemente es portada de capítulo
  if (wordCount > 80) return;

  const nextCtx = state.searchIndex.filter(p => p.page >= page && p.page <= page + 3).map(p => p.text.slice(0, 400)).join('\n');
  const prompt = `El usuario está a punto de empezar una nueva sección del libro "${state.currentDoc?.title || ''}" en la página ${page}.

Texto de las siguientes páginas:
${nextCtx}

${STYLE_BLOCK}

En 3-4 líneas, anticipa la idea base de esta sección y qué consecuencia o pregunta abre (no solo "de qué trata"). Sin títulos, sin bullets, un párrafo fluido en español.`;

  try {
    const r = await fetch(`${GEMINI_API}?key=${state.geminiKey}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ contents: [{ role:'user', parts:[{ text: prompt }] }] })
    });
    const d = await r.json();
    const preview = d.candidates?.[0]?.content?.parts?.map(p => p.text).join('').trim() || null;
    if (!preview) return;

    const el = document.createElement('div');
    el.id = 'chapter-preview'; el.className = 'chapter-preview';
    el.innerHTML = `
      <div class="chapter-preview-header">
        <div class="chapter-preview-title">📖 Antes de leer esta sección…</div>
        <button class="chapter-preview-close" id="cp-close">✕</button>
      </div>
      <div class="chapter-preview-body">
        <div style="font-size:13px;line-height:1.65;color:var(--ink)">${esc(preview)}</div>
      </div>`;
    document.body.appendChild(el);
    document.getElementById('cp-close').onclick = () => el.remove();
    setTimeout(() => el.remove(), 12000);
  } catch(_) {}
}
